<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OMNI · sound dispersion</title>
<style>
  /* OCR-B, loaded relative to projects/omni/ so the iframe is self-contained,
     matching the KART mechanism. */
  @font-face{ font-family:"OCR-B Local"; src:url("../../fonts/ocr-b.otf") format("opentype"); font-weight:400; font-style:normal; font-display:swap; }
  :root{ --paper:#e9e7e2; --ink:#141414; --red:#e2191b; --mono:"OCR-B Local","OCR B","OCR-B",ui-monospace,"Courier New",monospace; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:none;margin:0;padding:0;}
  /* ---- TRANSPARENT BUFFER (same trick as KART's mechanism) ----
     The wavefronts are circles up to r=410 (omni) and arcs up to r=500
     (stereo) thrown from emitters at x=115/358, y=287 - far outside the art's
     own 563.75 x 399.81 viewBox. They used to be hard-clipped at the frame
     edge, which read as the sound stopping at an invisible wall.

     An iframe cannot paint outside itself, so the only way to let the waves
     run is to make the iframe BIGGER than the art and keep the extra
     transparent. That is what this padding is: a buffer of 200 art-units left
     and right, 180 above, 200 below, expressed as a % of the frame width
     (padding percentages always resolve against width, so all four stay in
     proportion at any size). The art then occupies the middle 58.5%.
     project.html's .hiw-graphic negative margins crop most of that buffer back
     out of the page flow, so the waves overlap neighbouring sections instead
     of leaving a hole - Owen's ask. */
  .stage{position:relative;background:transparent;
    padding:18.677% 20.752% 20.752%;}
  /* two stacked full-size layers: animated waves BEHIND, the scene art
     (people + logo-shaped speakers) on top. overflow is VISIBLE now - the
     buffer above is what stops the waves escaping the iframe, not a clip. */
  .scene{position:relative;width:100%;overflow:visible;}
  .scene .layer{display:block;width:100%;height:auto;}
  /* The waves svg is deliberately LARGER than .scene and hangs outside it on
     every side. Its box and its viewBox are expanded by exactly the same
     buffer, so its scale matches the art layer's exactly and the emitters stay
     locked to the speakers. Horizontal %s resolve against .scene's width and
     vertical against its height, which is why the two pairs differ. */
  .scene .waves{position:absolute;
    left:-35.478%; width:170.955%;
    top:-45.022%;  height:195.046%;
    overflow:visible;pointer-events:none;}
  /* STEREO speaker blocks: plain rectangular speakers drawn OVER the scene's
     logo-shaped speakers. Shown in STEREO, hidden in OMNI (revealing the logo
     speakers) - so only OMNI reads as the logo, matching the original. */
  .scene .blocks{position:absolute;inset:0;height:100%;pointer-events:none;}
  /* waves: KART-weight ink stroke, held at a constant thickness regardless of
     the graphic's display size (non-scaling-stroke). */
  #sw-waves *{fill:none;stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke;}
  /* controls: same grammar as KART - mode buttons in a row, description under
     them, then the volume line. Bottom-left, red when active, no boxes. */
  .ui{position:absolute;left:5%;bottom:8%;z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;max-width:72%;gap:12px;}
  .ui > *{pointer-events:auto;}
  .modes{display:flex;flex-wrap:wrap;gap:20px;margin:0;}
  .modes button{font-family:var(--mono);font-size:clamp(12px,1.1vw,14px);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);background:none;border:0;padding:4px 0;cursor:pointer;text-shadow:0 0 5px var(--paper),0 0 5px var(--paper);transition:color .12s ease;}
  .modes button:hover{color:var(--red);}
  .modes button[aria-pressed="true"]{color:var(--red);}
  .modes button:focus-visible{outline:2px solid var(--red);outline-offset:3px;}
  .meta{margin:0;max-width:46ch;font-size:clamp(12px,1.1vw,14px);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);line-height:1.5;text-shadow:0 0 5px var(--paper),0 0 5px var(--paper),0 0 5px var(--paper);}
  .vol{display:flex;align-items:center;gap:12px;}
  .vol-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 5px var(--paper),0 0 5px var(--paper);}
  .vol input{-webkit-appearance:none;appearance:none;width:150px;max-width:38vw;height:1px;background:var(--ink);cursor:pointer;}
  .vol input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;background:var(--red);border:0;cursor:pointer;}
  .vol input::-moz-range-thumb{width:12px;height:12px;background:var(--red);border:0;border-radius:0;cursor:pointer;}
  @media (max-width:640px){ .ui{position:static;padding:12px 0 0;max-width:none;} }
</style>
</head>

  </div>

<script>
(function(){
  const SVGNS='http://www.w3.org/2000/svg';
  const wavesG=document.getElementById('sw-waves');
  const blocksEl=document.getElementById('sw-blocks');
  const descEl=document.getElementById('desc');
  const volEl=document.getElementById('vol');
  // stereo shows the rectangular blocks (hiding the logo speakers); omni hides
  // them so only omni reads as the logo.
  function paintSpeakers(){ if(blocksEl) blocksEl.style.display = (mode==='stereo') ? '' : 'none'; }
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // emitters sit at the two speaker positions in the scene
  const emitters=[{cx:114.91,cy:286.81},{cx:358.48,cy:286.81}];
  const R0=26, SPEED=0.10;                 // constant speed => louder lives longer, not faster
  const MODES={
    stereo:{ maxR:500, arc:[222,318],
      desc:"As a conventional pair, sound beams forward and the stereo image only holds in one sweet spot." },
    omni:{ maxR:410, arc:null,
      desc:"The cast diffuser scatters each driver in every direction, reaching every listener evenly." }
  };

  let mode='stereo', volume=55;
  // last seeded far in the past so the first wavefront appears at once (the
  // iframe's clock starts at 0, so [0,0] would sit empty for one full interval)
  let waves=[], last=[-1e7,-1e7], pool=[];

  function postHeight(){
    // report the .wrap box height ONLY - NOT Math.max with documentElement.scrollHeight,
    // which grows to match the iframe height the parent just set and ratchets it up
    // (the gap-before-read-more bug). .wrap ignores the absolute .ui overlay.
    var wrap=document.querySelector('.wrap');
    var h = wrap ? Math.ceil(wrap.getBoundingClientRect().height) : document.body.scrollHeight;
    if(window.parent!==window) window.parent.postMessage({type:'mechHeight', height:h}, '*');
  }

  function arcPath(cx,cy,r,a0,a1){
    const rad=d=>d*Math.PI/180;
    const x0=cx+r*Math.cos(rad(a0)), y0=cy+r*Math.sin(rad(a0));
    const x1=cx+r*Math.cos(rad(a1)), y1=cy+r*Math.sin(rad(a1));
    const large=(a1-a0)>180?1:0;
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r.toFixed(2)} ${r.toFixed(2)} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  }

  /* ---------- RUN ONLY WHEN THERE IS SOMETHING TO SHOW ----------
     Same problem the KART mechanism had: this loop ran forever, rewriting SVG
     path/circle attributes every frame whether or not the graphic was on
     screen, and whether or not any wavefronts were actually in flight. Now the
     parent page reports visibility (see project.html) and the loop stands down
     when the graphic is scrolled away, the tab is hidden, or the volume is at
     zero with nothing left mid-flight. Any interaction calls wake(). */
  let running=false, visible=true;
  function wake(){
    if(!running && visible){ running=true; requestAnimationFrame(tick); }
  }
  window.addEventListener("message",function(ev){
    const d=ev.data;
    if(!d || d.type!=="mechVisible") return;
    visible=!!d.visible;
    if(visible) wake();
  });
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ visible=false; } else { visible=true; wake(); }
  });

  function tick(now){
    if(!visible){ running=false; return; }
    const cfg=MODES[mode];
    if(volume>0 && !reduce){
      const reach=cfg.maxR*(0.32 + volume/100*0.68);   // volume grows size only
      const life=(reach-R0)/SPEED;
      const interval=life/2;                            // a second front always in flight
      const maxOp=0.25 + volume/100*0.45;
      for(let i=0;i<emitters.length;i++){
        if(now-last[i] >= interval){ last[i]=now; waves.push({i,born:now,mode,reach,life,maxOp,arc:cfg.arc}); }
      }
    }
    const active=[];
    for(const w of waves){ const p=(now-w.born)/w.life; if(p>=0&&p<1) active.push({w,p}); }
    waves=active.map(a=>a.w);
    for(let k=0;k<active.length;k++){
      const {w,p}=active[k], e=emitters[w.i];
      const r=R0+p*(w.reach-R0);
      const op=((1-p)*w.maxOp).toFixed(3);
      const type=w.arc?'path':'circle';
      let node=pool[k];
      if(!node || node.tagName.toLowerCase()!==type){ if(node) node.remove(); node=document.createElementNS(SVGNS,type); pool[k]=node; wavesG.appendChild(node); }
      node.style.display=''; node.setAttribute('opacity',op);
      if(w.arc){ node.setAttribute('stroke-linecap','round'); node.setAttribute('d', arcPath(e.cx,e.cy,r,w.arc[0],w.arc[1])); }
      else {
        // cx/cy are the fixed speaker positions - they never change for the
        // life of the node, so only write them when this node is newly a circle
        // for this emitter. Only r moves. Skipping two redundant attribute
        // writes per wave per frame sounds trivial, but each one invalidates
        // the SVG element and it adds up across a dozen live wavefronts.
        if(node.__e !== w.i){ node.setAttribute('cx',e.cx); node.setAttribute('cy',e.cy); node.__e = w.i; }
        node.setAttribute('r',r.toFixed(2));
      }
    }
    for(let k=active.length;k<pool.length;k++){ if(pool[k]) pool[k].style.display='none'; }

    // nothing sounding and nothing still fading out: stand down until something
    // changes (mode click, volume drag, scrolled back into view)
    if(active.length===0 && (volume<=0 || reduce)){ running=false; return; }
    requestAnimationFrame(tick);
  }

  document.getElementById('modes').addEventListener('click',function(ev){
    const b=ev.target.closest('button'); if(!b) return;
    mode=b.dataset.mode;
    [...ev.currentTarget.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
    descEl.textContent=MODES[mode].desc;
    paintSpeakers();
    waves=[]; last=[-1e7,-1e7]; pool.forEach(n=>{n.style.display='none'; n.__e=undefined;});   // clear + respawn at once
    wake();
  });
  volEl.addEventListener('input',function(){ volume=+volEl.value; wake(); });

  descEl.textContent=MODES[mode].desc;
  paintSpeakers();
  wake();

  window.addEventListener('load', postHeight);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
  setTimeout(postHeight, 300);
  window.addEventListener('resize', postHeight);
  if(window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
})();
</script>
</body>
</html>
