<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FLOW · airflow</title>
<script>/* DARK MODE (19 Nov 2026): follow the page's ?theme test switch if it set one; else the system */
(function(){ try { var t = parent.document.documentElement.getAttribute("data-theme"); if(t) document.documentElement.setAttribute("data-theme", t); } catch(e){} })();</script>
<style>
  /* Same family as projects/kart/mechanism.html and projects/omni/mechanism.html:
     transparent canvas printed onto the page, ink line art, one red accent
     (the slider's mark), text controls.
     REDRAWN 16 Nov 2026 from Owen's reference, a cross-flow fan section
     (docs/references/flow_mechanism_2026-11-16/owen_reference_crossflow_fan.png):
     "make it more in the style of the other mechanisms. remove the labels.
     allow for a slider to increase fan speed. no need to have the wind sock
     demo thing in the previous." The old frame (crossflow / axial modes, the
     ribbon on the pointer) is in _backup_originals/2026-11-16_flow_mechanism/. */
  @font-face{
    font-family:"OCR-B Local";
    src:url("../../fonts/ocr-b.woff2") format("woff2"),url("../../fonts/ocr-b.otf") format("opentype");
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --paper:#ffffff;
    --ink:#141414;
    --red:#e2191b;
    --mono:"OCR-B Local","OCR B","OCR-B",ui-monospace,"Courier New",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);
    font-family:var(--mono);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:none;margin:0;padding:0;}
  .stage{position:relative;background:transparent;}
  canvas{display:block;width:100%;height:auto;touch-action:pan-y;}
  /* The control sits in flow UNDER the drawing, on the page's left margin
     (Owen, 2026-10-03). The left padding is the 9.6% the page hangs this frame
     past its column, so the slider starts on the margin itself. */
  .ui{display:flex;flex-direction:column;align-items:flex-start;padding:6px 0 0 9.574%;}
  /* speed: the same control as OMNI's volume: a label, a 1px ink rule, a red
     mark. The input is 26px tall so a finger can take it; the rule is drawn. */
  .speed{display:flex;align-items:center;gap:12px;}
  .speed-label{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);}
  .speed input{-webkit-appearance:none;appearance:none;width:150px;max-width:38vw;height:26px;margin:0;padding:0;
    cursor:pointer;border-radius:0;background:linear-gradient(var(--ink),var(--ink)) center/100% 1px no-repeat;}
  .speed input::-webkit-slider-runnable-track{height:26px;background:transparent;}
  .speed input::-moz-range-track{height:26px;background:transparent;}
  .speed input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;margin-top:7px;
    background:var(--red);border:0;border-radius:0;cursor:pointer;}
  .speed input::-moz-range-thumb{width:12px;height:12px;background:var(--red);border:0;border-radius:0;cursor:pointer;}
  .speed input:focus{outline:0;}
  .speed input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  @media (max-width:640px){ .ui{padding:10px 12px 0;} }   /* 12px: the site text margin on a phone */
  /* reduced motion: the drawing is still, so there is nothing for the slider to change */
  @media (prefers-reduced-motion:reduce){ .ui{display:none;} }
  /* DARK MODE (19 Nov 2026): the same colours, switched by theme. Colours only. */
  :root{ color-scheme:light dark; --paper:light-dark(#ffffff,#131312); --ink:light-dark(#141414,#e9e7e2); --red-text:light-dark(#b5120f,#ff5a4f); --ink-2:light-dark(#5a5957,#a5a39e); }
  :root[data-theme="light"]{ color-scheme:light; } :root[data-theme="dark"]{ color-scheme:dark; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- data-drag="no": nothing on the drawing to drag, only the slider under
         it, so no DRAG / TOUCH TO INTERACT label and the page scrolls straight
         through it on touch (js/mech-touch.js, the OMNI rule) -->
    <div class="stage" data-drag="no">
      <canvas id="c" role="img" aria-label="Section through FLOW's cross-flow fan: air is drawn in from the upper right, curves through the turning impeller around a vortex, is guided round by the spiral plate and leaves to the right as a flat, even sheet"></canvas>
    </div>
    <div class="ui">
      <label class="speed"><span class="speed-label">Speed</span>
        <input id="speed" type="range" min="0" max="100" value="40" aria-label="Fan speed"></label>
    </div>
  </div>

<script>
(function(){
  /* ---------- GEOMETRY (logical units; the canvas scales to its width) ----------
     A section through the fan, drawn from Owen's reference: the impeller
     circle with its curved blades, the spiral guiding plate round the left and
     bottom, the vortex tongue at the right, the dashed outlet line, air
     arriving diagonally from the upper right, curving through the impeller
     round the vortex and leaving as parallel arrows to the right.

     Everything below is written in units of the impeller radius R, measured
     from the impeller's centre C (x right, y down), so the whole drawing moves
     and scales with C and R.

     The page hangs this frame 9.6% (90 units) past the left of its column and
     tucks its top under the how-it-works paragraph, so nothing is drawn left
     of x=90, right of x=850 or above y=140. */
  const W=940, H=640;
  const C={x:258,y:436}, R=122;
  const BLADES=26, RI=0.80;                    // blade count; blade root, as a share of R
  const deg=Math.PI/180;
  const X=u=>C.x+u*R, Y=v=>C.y+v*R;
  const OUT_X=1.96;                            // the dashed outlet line
  const PLATE_A0=217*deg, PLATE_A1=90*deg;     // spiral guiding plate: from upper left, round the left, to the bottom
  const PLATE_R0=1.22, PLATE_R1=1.56;
  const TONGUE={x0:1.15,y0:0.165,x1:OUT_X,y1:0.185};

  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');

  /* Review 14 Nov 2026 (B5): no line thinner than 1 css px. On a phone this
     canvas shows at about 0.4x its logical size, so a 1.2 unit stroke landed at
     0.5 px and the drawing faded out. Every lineWidth set here is raised to
     1 css px when the canvas is shown smaller than its logical size. */
  (function(){
    const d=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'lineWidth');
    if(!d||!d.set) return;
    Object.defineProperty(ctx,'lineWidth',{configurable:true,
      get(){ return d.get.call(ctx); },
      set(v){ const k=(canvas.clientWidth||W)/W; d.set.call(ctx, k<1 ? Math.max(v,1/k) : v); }});
  })();
  const speedEl=document.getElementById('speed');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let scale=1, unit=1;                         // unit: logical units per css px (1 or more)

  /* ---------- STREAMLINES ----------
     Seven lanes, top to bottom at the outlet as in the reference. Each is:
     a straight run in from `from` to the impeller (entry angle `a`, on the
     circle), a smooth curve through `via` inside the impeller and the casing,
     then a straight horizontal run from `out` to x=`end`.
     Lane order is kept, so no two cross: the lane that comes in nearest the
     tongue wraps tightest round the vortex and leaves just under the tongue;
     the one that comes in at the far left is carried round the guiding plate
     and leaves along the bottom.
     This is a diagram of how the air moves, not a simulation. */
  const LANE_DEF=[
    {from:[ 2.42,-0.20], a:  -3.5, via:[[0.84,-0.03],[0.71,0.13],[0.77,0.29]],                          out:[1.02,0.37], end:3.80},
    {from:[ 2.98,-1.04], a: -15.5, via:[[0.74,-0.15],[0.54,0.10],[0.59,0.38],[0.80,0.52]],              out:[1.12,0.55], end:4.35},
    {from:[ 2.46,-1.84], a: -35,   via:[[0.56,-0.31],[0.36,0.06],[0.40,0.42],[0.62,0.64]],              out:[1.05,0.73], end:4.70},
    {from:[ 1.68,-2.34], a: -55,   via:[[0.31,-0.42],[0.13,0.08],[0.18,0.52],[0.44,0.80]],              out:[0.95,0.91], end:4.82},
    {from:[ 0.70,-2.22], a: -78.5, via:[[-0.02,-0.50],[-0.16,0.10],[-0.08,0.64],[0.20,0.96]],           out:[0.80,1.09], end:4.70},
    {from:[-0.12,-1.60], a:-104.5, via:[[-0.40,-0.40],[-0.46,0.20],[-0.36,0.74],[-0.08,1.10]],          out:[0.62,1.27], end:4.35},
    {from:[-0.74,-1.64], a:-137.4, via:[[-0.80,-0.20],[-0.79,0.34],[-0.66,0.84],[-0.36,1.22]],          out:[0.45,1.44], end:3.80}
  ];
  function buildLane(def){
    const e={x:X(Math.cos(def.a*deg)),y:Y(Math.sin(def.a*deg))};       // where it meets the impeller
    const p0={x:X(def.from[0]),y:Y(def.from[1])};
    const po={x:X(def.out[0]),y:Y(def.out[1])}, pe={x:X(def.end),y:Y(def.out[1])};
    const inLen=Math.hypot(e.x-p0.x,e.y-p0.y), dir={x:(e.x-p0.x)/inLen,y:(e.y-p0.y)/inLen};
    const pts=[];
    const push=(x,y)=>pts.push({x,y});
    const nIn=Math.max(2,Math.round(inLen/8));
    for(let k=0;k<=nIn;k++) push(p0.x+(e.x-p0.x)*k/nIn, p0.y+(e.y-p0.y)*k/nIn);
    const iEntry=pts.length-1;
    // the curve: Catmull-Rom through entry, via..., out. Its end tangents are
    // set so it leaves the straight run in and meets the straight run out
    // without a kink.
    const P=[e].concat(def.via.map(q=>({x:X(q[0]),y:Y(q[1])})),[po]);
    const n=P.length, d0=Math.hypot(P[1].x-P[0].x,P[1].y-P[0].y), d1=Math.hypot(P[n-1].x-P[n-2].x,P[n-1].y-P[n-2].y);
    const A=[{x:P[1].x-dir.x*2*d0,y:P[1].y-dir.y*2*d0}].concat(P,[{x:P[n-2].x+2*d1,y:P[n-2].y}]);
    for(let i=1;i<A.length-2;i++){
      const a=A[i-1], b=A[i], c=A[i+1], d=A[i+2];
      for(let k=1;k<=14;k++){
        const t=k/14, t2=t*t, t3=t2*t;
        push(0.5*((2*b.x)+(-a.x+c.x)*t+(2*a.x-5*b.x+4*c.x-d.x)*t2+(-a.x+3*b.x-3*c.x+d.x)*t3),
             0.5*((2*b.y)+(-a.y+c.y)*t+(2*a.y-5*b.y+4*c.y-d.y)*t2+(-a.y+3*b.y-3*c.y+d.y)*t3));
      }
    }
    const iOut=pts.length-1;
    const nOut=Math.max(2,Math.round((pe.x-po.x)/10));
    for(let k=1;k<=nOut;k++) push(po.x+(pe.x-po.x)*k/nOut, po.y);
    let L=0; pts[0].d=0;
    for(let i=1;i<pts.length;i++){ L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); pts[i].d=L; }
    const lane={pts,L,dEntry:pts[iEntry].d,dOut:pts[iOut].d,dir,e,pe};
    /* The air's speed along the lane: slow far out, picking up as it is drawn
       in, quickest in the outlet. The moving marks are spaced evenly in TIME,
       so they bunch where the air is slow and stretch where it is quick. tau[i]
       is the time (in units of length at speed 1) to reach pts[i]. */
    lane.f=d=>{
      if(d<lane.dEntry){ const t=d/lane.dEntry; return 0.5+0.5*t*t; }
      if(d<lane.dOut) return 1;
      return 1+0.3*Math.min(1,(d-lane.dOut)/90);
    };
    let T=0; pts[0].tau=0;
    for(let i=1;i<pts.length;i++){ T+=(pts[i].d-pts[i-1].d)/lane.f((pts[i].d+pts[i-1].d)/2); pts[i].tau=T; }
    lane.T=T;
    lane.n=Math.max(3,Math.round(T/118));                              // marks on the lane
    return lane;
  }
  const LANES=LANE_DEF.map(buildLane);
  function at(lane,d){
    const p=lane.pts; if(d<=0) return p[0]; if(d>=lane.L) return p[p.length-1];
    let lo=0,hi=p.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(p[m].d<d) lo=m; else hi=m;}
    const t=(d-p[lo].d)/((p[hi].d-p[lo].d)||1);
    return {x:p[lo].x+(p[hi].x-p[lo].x)*t, y:p[lo].y+(p[hi].y-p[lo].y)*t};
  }
  function dAtTau(lane,tau){
    const p=lane.pts; let lo=0,hi=p.length-1;
    while(hi-lo>1){const m=(lo+hi)>>1; if(p[m].tau<tau) lo=m; else hi=m;}
    const t=(tau-p[lo].tau)/((p[hi].tau-p[lo].tau)||1);
    return p[lo].d+(p[hi].d-p[lo].d)*t;
  }

  /* ---------- DRAWING ---------- */
  /* DARK MODE (19 Nov 2026): the drawing's ink and paper by theme (colours only) */
  const darkMQ=window.matchMedia('(prefers-color-scheme: dark)');
  let INK, INK_SOFT, PAPER;
  function setTheme(){ const t=document.documentElement.getAttribute('data-theme'); const dk=t?t==='dark':darkMQ.matches;
    INK=dk?'#e9e7e2':'#141414'; INK_SOFT=dk?'rgba(233,231,226,0.42)':'rgba(20,20,20,0.42)'; PAPER=dk?'#131312':'#ffffff'; }
  setTheme(); if(darkMQ.addEventListener) darkMQ.addEventListener('change',setTheme);
  // INK_SOFT: KART's radar-cone grey, for the still streamlines
  function arrow(x,y,ang,col){
    const l=Math.max(13,7.5*unit), w=Math.max(3.4,2.1*unit);           // never under about 7 css px long
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x-Math.cos(ang)*l-Math.sin(ang)*w, y-Math.sin(ang)*l+Math.cos(ang)*w);
    ctx.lineTo(x-Math.cos(ang)*l+Math.sin(ang)*w, y-Math.sin(ang)*l-Math.cos(ang)*w);
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  }
  // the still diagram: every lane as a thin line, an arrowhead where it meets
  // the impeller and one where it leaves the drawing
  function streamlines(){
    ctx.lineWidth=1; ctx.strokeStyle=INK_SOFT; ctx.lineJoin='round'; ctx.lineCap='butt';
    for(const ln of LANES){
      ctx.beginPath(); ln.pts.forEach((q,j)=>j?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.stroke();
    }
    for(const ln of LANES){
      arrow(ln.e.x,ln.e.y,Math.atan2(ln.dir.y,ln.dir.x),INK);
      arrow(ln.pe.x+Math.max(13,7.5*unit),ln.pe.y,0,INK);
    }
  }
  // the moving air: short ink marks riding the lanes
  function air(phase,spd){
    if(spd<=0.001) return;
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=1.6; ctx.strokeStyle=INK;
    for(let li=0;li<LANES.length;li++){
      const ln=LANES[li], n=ln.n;
      for(let k=0;k<n;k++){
        let u=(k+phase*118/ln.T*n+li*0.37)/n; u-=Math.floor(u);          // 118 units of travel per unit of phase, at speed 1
        const d=dAtTau(ln,u*ln.T), f=ln.f(d);
        const len=(12+22*spd)*f, d0=Math.max(0,d-len);
        const fade=Math.min(1,d/50,(ln.L-d)/60);                        // in at the start, out at the end
        if(fade<=0.02) continue;
        ctx.globalAlpha=fade;
        ctx.beginPath();
        for(let s=0;s<=5;s++){ const q=at(ln,d0+(d-d0)*s/5); s?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }
        ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  }
  function plateR(a){ const t=(PLATE_A0-a)/(PLATE_A0-PLATE_A1), s=t*t*(3-2*t); return PLATE_R0+(PLATE_R1-PLATE_R0)*s; }
  function casing(){
    ctx.strokeStyle=INK; ctx.lineJoin='round'; ctx.lineCap='round';
    // the guiding plate: a spiral opening out from the upper left round to the
    // bottom, then straight along to the outlet. A small curl at its lip.
    ctx.lineWidth=1.8;
    ctx.beginPath();
    const lip={x:X(Math.cos(PLATE_A0)*PLATE_R0),y:Y(Math.sin(PLATE_A0)*PLATE_R0)};
    ctx.arc(lip.x+3.2,lip.y-5.2,6,PLATE_A0-Math.PI*1.02,PLATE_A0-Math.PI*0.02,true);
    for(let k=0;k<=60;k++){
      const a=PLATE_A0+(PLATE_A1-PLATE_A0)*k/60, r=plateR(a);
      ctx.lineTo(X(Math.cos(a)*r),Y(Math.sin(a)*r));
    }
    ctx.lineTo(X(OUT_X),Y(PLATE_R1));
    ctx.stroke();
    // the vortex tongue: a thin plate with a rounded nose toward the impeller
    const t=TONGUE, n=3.6, tx=X(t.x0), ty=Y(t.y0), px=tx+n*3.4;
    ctx.beginPath();
    ctx.moveTo(X(t.x1),Y(t.y1));
    ctx.lineTo(px,ty);
    ctx.bezierCurveTo(tx+n,ty-n*1.25, tx-n*0.7,ty-n*1.15, tx-n*0.7,ty);
    ctx.bezierCurveTo(tx-n*0.7,ty+n*1.15, tx+n,ty+n*1.25, px,ty);
    ctx.stroke();
    // the outlet: a dashed line from the tongue down to the plate
    ctx.lineWidth=1.2; ctx.lineCap='butt';
    const dash=Math.max(5,3*unit);
    ctx.setLineDash([dash,dash]);
    ctx.beginPath(); ctx.moveTo(X(OUT_X),Y(t.y1)); ctx.lineTo(X(OUT_X),Y(PLATE_R1)); ctx.stroke();
    ctx.setLineDash([]);
  }
  function impeller(phi){
    ctx.strokeStyle=INK; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(C.x,C.y,R,0,Math.PI*2); ctx.stroke();
    // forward-curved blades: root on RI, tip on the rim, leaning the way it turns
    ctx.lineWidth=1.2;
    for(let i=0;i<BLADES;i++){
      const a=phi+i*2*Math.PI/BLADES;
      const ix=C.x+Math.cos(a)*R*RI, iy=C.y+Math.sin(a)*R*RI;
      const ox=C.x+Math.cos(a-0.20)*R, oy=C.y+Math.sin(a-0.20)*R;
      const mr=R*(RI+1)/2*1.035, mx=C.x+Math.cos(a-0.035)*mr, my=C.y+Math.sin(a-0.035)*mr;
      ctx.beginPath(); ctx.moveTo(ix,iy); ctx.quadraticCurveTo(mx,my,ox,oy); ctx.stroke();
    }
  }

  /* ---------- LOOP: only while visible and turning ----------
     The parent page says when the frame is on screen (mechVisible); a hidden
     tab stops it too. At speed 0, or with reduced motion, one still frame is
     drawn and the loop stands down until the slider moves. dt is clamped to
     0..0.05 s (a negative frame time froze KART once, 14 Nov 2026). */
  let phi=0, phase=0, last=performance.now(), running=false, visible=true;
  function speed(){ return reduce?0:(+speedEl.value)/100; }
  function frame(now){
    const dt=Math.max(0,Math.min(0.05,(now-last)/1000)); last=now;
    if(!visible){ running=false; return; }
    const spd=speed();
    /* the blades stop gaining speed at 5.8 rad/s (0.4 of a blade gap per frame at 60 Hz); any faster and
       they seem to turn backward. The air (phase) keeps speeding up to 100. (review 16 Nov evening, S2) */
    phi-=dt*Math.min(spd*7.5,5.8);                                     // counter-clockwise: down the plate side, out along the bottom
    if(phi<-Math.PI*2) phi+=Math.PI*2;
    phase+=dt*spd*4.2;
    if(phase>1e6) phase-=1e6;
    ctx.setTransform(scale,0,0,scale,0,0);
    ctx.clearRect(0,0,W,H);
    streamlines();
    air(phase,spd);
    casing();
    impeller(phi);
    if(spd<=0){ running=false; return; }
    requestAnimationFrame(frame);
  }
  function wake(){ if(!running && visible){ running=true; last=performance.now(); requestAnimationFrame(frame); } }

  function resize(){
    const cssW=canvas.parentElement.clientWidth;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    let w=Math.round(cssW*dpr), h=Math.round(cssW*(H/W)*dpr);
    const MAX_PX=2400000;
    if(w*h>MAX_PX){ const k=Math.sqrt(MAX_PX/(w*h)); w=Math.round(w*k); h=Math.round(h*k); }
    canvas.style.width=cssW+'px'; canvas.width=w; canvas.height=h; scale=canvas.width/W;
    unit=Math.max(1,W/Math.max(cssW,1));
    wake(); postHeight();
  }
  function postHeight(){
    const wrap=document.querySelector('.wrap');
    const h=wrap?Math.ceil(wrap.getBoundingClientRect().height):document.body.scrollHeight;
    if(window.parent!==window) window.parent.postMessage({type:'mechHeight',height:h},'*');
  }

  window.addEventListener('message',ev=>{ const d=ev.data; if(!d||d.type!=='mechVisible') return; visible=!!d.visible; if(visible) wake(); });
  document.addEventListener('visibilitychange',()=>{ visible=!document.hidden; if(visible) wake(); });
  speedEl.addEventListener('input',wake);
  window.addEventListener('resize',resize);

  resize(); wake();
  window.addEventListener('load',postHeight);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(postHeight);
  setTimeout(postHeight,300);
  if(window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

  /* touch: js/mech-touch.js reads data-drag="no" on .stage and leaves the page to scroll through the drawing */
})();
</script>
<script src="../../js/mech-touch.js?v=3"></script>
</body>
</html>
