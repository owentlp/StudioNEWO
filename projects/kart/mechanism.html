<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KART · light behaviour</title>
<script>/* DARK MODE (19 Nov 2026): follow the page's ?theme test switch if it set one; else the system */
(function(){ try { var t = parent.document.documentElement.getAttribute("data-theme"); if(t) document.documentElement.setAttribute("data-theme", t); } catch(e){} })();</script>
<style>
  /* OCR-B, loaded relative to projects/kart/ so the iframe is self-contained */
  @font-face{
    font-family:"OCR-B Local";
    src:url("../../fonts/ocr-b.woff2") format("woff2"),url("../../fonts/ocr-b.otf") format("opentype");
    font-weight:400; font-style:normal; font-display:swap;
  }
  :root{
    --paper:#ffffff;
    --ink:#141414;
    --red:#e2191b;
    --mono:"OCR-B Local","OCR B","OCR-B",ui-monospace,"Courier New",monospace;
  }
  *{box-sizing:border-box;}
  /* transparent so the demo prints onto the page paper like an inline svg */
  html,body{margin:0;padding:0;background:transparent;color:var(--ink);
    font-family:var(--mono);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:none;margin:0;padding:0;}
  .stage{position:relative;background:transparent;}
  canvas{display:block;width:100%;height:auto;touch-action:pan-y;cursor:none;}
  /* the controls float OVER the canvas, moved to match Owen's 2026-07-11
     Figma screenshot: the mode buttons sit in a row left-of-centre (not a
     right-aligned column), with the mode description directly under them,
     full width of that same row, both left-aligned. No borders or chips:
     the buttons read as printed text, red when active. pointer-events pass
     through the empty areas to the canvas. */
  /* controls sit inside the graphic. TOP-anchored so the mode buttons stay put
     and a longer mode description just adds a line BELOW them (bottom-anchoring
     grew the block upward, which shoved the buttons up when Shadow wrapped to a
     third line). cursor:none so the custom canvas cursor stays hidden-arrow over
     the controls too. */
  /* The mode buttons are fixed-width blocks now, so the old max-width on .ui
     (which capped the WHOLE control stack) wrapped "Dim Away" onto a second row
     as soon as the graphic was narrower than about 560px of button. The cap
     belongs on the paragraph, not on the button row - .meta keeps its own
     46ch - so .ui is uncapped and the buttons stay in one line wherever there
     is room for them. */
  /* top:80%, was 67%. Everything the radar draws is clipped to the room
     (ctx.rect(ROOM...) + clip), and the room's bottom edge sits at
     BUF_TOP + ROOM_H = 750 of the 960-unit canvas, i.e. 78.1%. At 67% the
     buttons sat INSIDE the room, so the cone's boundary line ran straight
     through them - Owen: "that thin line jutting into the buttons looks bad".
     80% puts the row just clear of the room's bottom edge, in the transparent
     bottom buffer that was dead space anyway. If BUF_TOP, BUF_BOT or ROOM_H
     change, recompute: (BUF_TOP + ROOM_H) / (ROOM_H + BUF_TOP + BUF_BOT). */
  /* RIGHT-JUSTIFIED to the room's right edge (Owen, 2026-09-03), which
     css/style.css now lines up with the page's right margin - so the controls
     hang off the same edge as everything else on that side of the page.
     right:9.574% is BUF_X / W, the transparent margin between the element's
     edge and the drawn room, so this tracks the artwork rather than the canvas.
     top:80%, was 67%. Everything the radar draws is clipped to the room
     (ctx.rect(ROOM...) + clip), and the room's bottom edge sits at
     BUF_TOP + ROOM_H = 750 of the 960-unit canvas, i.e. 78.1%. At 67% the
     buttons sat INSIDE the room, so the cone's boundary line ran straight
     through them - Owen: "that thin line jutting into the buttons looks bad".
     80% puts the row just clear of it, in transparent bottom buffer that was
     dead space anyway. If BUF_TOP, BUF_BOT or ROOM_H change, recompute:
     (BUF_TOP + ROOM_H) / (ROOM_H + BUF_TOP + BUF_BOT). */
  .ui{position:absolute;left:auto;right:9.574%;top:80%;z-index:2;pointer-events:none;cursor:none;
    display:flex;flex-direction:column;align-items:flex-end;max-width:none;}
  .ui .modes button{pointer-events:auto;cursor:none;}
  .modes{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0 22px;margin:0 0 4px;}
  /* held near 10px to sit in step with the site's body copy (.desc is 10px),
     with a mild vw term so it still tracks the graphic a little across sizes. */
  /* The site's one button style, as INQUIRE, VIEW IN YOUR SPACE and the model's
     controls: 12px, .16em, outlined in red at rest, solid red with white text
     for the mode that is on (Owen, 3 Nov 2026; was white on red, ink = on). */
  .modes button{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--red-text);background:transparent;border:0;padding:7px 0;cursor:pointer;border-radius:0;
    opacity:1;transition:none;}   /* the site's one button style (css/style.css, ONE BUTTON STYLE, 3 Nov 2026): outline in --red-text (#b5120f, 5.6:1) at rest, a 1px border inside the old 8px 14px box. Paper ground so the drawing never shows through the words */
  .modes button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:1.5px;text-underline-offset:4px;}   /* the chosen mode: ink with a red underline (text links, Owen 13 Nov 2026; css/style.css TEXT LINKS) */
  @media (hover:hover){ .modes button:not([aria-pressed="true"]):hover{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:1px;text-underline-offset:4px;} }   /* hover while off: the thin underline (mouse only, review 14 Nov C3) */
  .modes button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin:0;max-width:46ch;
    font-size:10.5px;line-height:1.36;letter-spacing:0;color:var(--ink);text-align:justify;text-align-last:right;
    text-shadow:0 0 5px var(--paper),0 0 5px var(--paper),0 0 5px var(--paper);}
  /* small windows: the canvas is too small to carry an overlay, so the
     controls drop into normal flow BELOW the graphic instead of stacking on
     top of it, with a fixed readable size. The height message includes them. */
  @media (max-width:640px){
    /* stacked under the graphic in one narrow column, where the rest of the
       page is left-aligned - the right-justification above belongs to the
       two-column desktop composition, not to this. */
    .ui{position:static;padding:10px 12px 0;max-width:none;align-items:flex-start;}   /* 12px: the site text margin on a phone (--tmar, 4 Nov 2026); the frame itself runs to the screen edge */
    .modes{gap:0 22px;margin:0 0 4px;justify-content:flex-start;}
    .meta{align-items:flex-start;text-align:justify;text-align-last:left;}
    .modes button{font-size:8.5px;padding:14px 0;cursor:pointer;}
    .meta{font-size:11px;}
    .ui{cursor:auto;}
    canvas{cursor:default;}
  }

  /* DRAG / TOUCH TO INTERACT (Owen, 16 Nov 2026): plain label text under the
     caption, never on the drawing and never a box or a button ("it doesnt need
     to be a button"). js/mech-touch.js puts it there (data-hint-in on .stage).
     On touch a tap anywhere on the drawing wakes it. */
  .hint{font-family:var(--mono);font-size:8.5px;line-height:1.36;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink);opacity:.62;white-space:nowrap;transition:opacity .3s ease;}
  .hint.gone{opacity:0;}
  @media (prefers-reduced-motion:reduce){ .hint{transition:none;} }
  /* DARK MODE (19 Nov 2026): the same colours, switched by theme. Colours only. */
  :root{ color-scheme:light dark; --paper:light-dark(#ffffff,#131312); --ink:light-dark(#141414,#e9e7e2); --red-text:light-dark(#b5120f,#ff5a4f); --ink-2:light-dark(#5a5957,#a5a39e); }
  :root[data-theme="light"]{ color-scheme:light; } :root[data-theme="dark"]{ color-scheme:dark; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage" data-drag="yes" data-hint-in=".meta" data-hint-pos="last">
      <canvas id="c" role="img" aria-label="Plan view of a room: the KART lamp, its radar cone and a person moving; the light follows the person"></canvas>
      <div class="ui">
        <div class="modes" id="modes" role="group" aria-label="Light mode">
          <button data-mode="follow" aria-pressed="true">Lighthouse</button>
          <button data-mode="shadow" aria-pressed="false">Shadow</button>
          <button data-mode="dimToward" aria-pressed="false">Dim Toward</button>
          <button data-mode="dimAway" aria-pressed="false">Dim Away</button>
        </div>
        <div class="meta">
          <span class="desc" id="desc" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  // the logical "room" is 760x500, but the canvas itself is padded well
  // beyond it on every side (BUF_*) so the lamp's glow has real room to
  // fade to nothing before it reaches the canvas edge, instead of being
  // hard-clipped by an invisible boundary that happened to sit right where
  // the light was still bright.
  //
  // 2026-07-13: buffers sized off the actual light-throw math, not guessed.
  // radialGlow's max radius is 34+326=360px from the lamp (dimAway/dimToward/
  // shadow's ambient fill). lighthouse/shadow's beam wedge reaches even
  // further, up to 560-580px from the lamp, and CONE (aimed at the bed
  // corner) spans a wide enough arc that it includes a near-straight-down
  // angle, so that full 560-580px throw applies to the bottom buffer too, not
  // just the shorter ambient radius. With the lamp sitting 132px below the
  // room's top edge and 368px above its bottom edge, the old BUF_TOP=140 was
  // ~90-220px short of containing the glow/beam before the canvas edge cut
  // them off, and BUF_BOT=50 was ~500px short for the beam case specifically
  // (the ambient radius alone was fine at the bottom, the beam wasn't).
  // BUF_TOP=300 and BUF_BOT=340 comfortably contain both. This makes the
  // canvas taller than the room needs on its own, and it's expected to
  // overlap neighbouring sections (Owen confirmed that's fine, this
  // graphic just needs the room to not clip its own light).
  // BUF_BOT trimmed 340->210: still contains the follow/shadow beam throw
  // (~560-580px below the lamp) with no hard clip, but cuts ~130px of dead
  // space under the radar so the graphic reads tighter and the UI sits close.
  // BUF_TOP=250 fully contains the proximity glow above the lamp (needs >=228
  // so its 360px radius clears the canvas top - at 130 the glow's upper edge was
  // being hard-clipped). This taller top band no longer wastes space because the
  // whole graphic is pulled up to underlap the how-it-works text on the page
  // (see .hiw-graphic margin-top in style.css), so the extra transparent top
  // just tucks behind that text. BUF_BOT holds the downward beam.
  const BUF_X=90, BUF_TOP=250, BUF_BOT=210;
  const ROOM_W=760, ROOM_H=500;
  const W=ROOM_W+BUF_X*2, H=ROOM_H+BUF_TOP+BUF_BOT;
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');

  /* Review 14 Nov 2026 (B5): no line thinner than 1 css px. On a phone this
     canvas shows at about 0.4x its logical size, so a 1.2 unit stroke landed at
     0.5 px and the drawing faded out. Every lineWidth set here is raised to
     1 css px when the canvas is shown smaller than its logical size. */
  (function(){
    const d=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'lineWidth');
    if(!d||!d.set) return;
    Object.defineProperty(ctx,'lineWidth',{configurable:true,
      get(){ return d.get.call(ctx); },
      set(v){ const k=(canvas.clientWidth||W)/W; d.set.call(ctx, k<1 ? Math.max(v,1/k) : v); }});
  })();
  /* DARK MODE (19 Nov 2026): the drawing's ink and paper by theme (colours only) */
  const darkMQ=window.matchMedia('(prefers-color-scheme: dark)');
  let INK, INK_SOFT, PAPER;
  function setTheme(){ const t=document.documentElement.getAttribute('data-theme'); const dk=t?t==='dark':darkMQ.matches;
    INK=dk?'#e9e7e2':'#141414'; INK_SOFT=dk?'rgba(233,231,226,0.42)':'rgba(20,20,20,0.42)'; PAPER=dk?'#131312':'#ffffff'; }
  setTheme(); if(darkMQ.addEventListener) darkMQ.addEventListener('change',setTheme);
  const descEl=document.getElementById('desc');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const ROOM={x:BUF_X,y:BUF_TOP,w:ROOM_W,h:ROOM_H};
  const lamp={x:455+BUF_X,y:132+BUF_TOP};
  const bed={x:498+BUF_X,y:92+BUF_TOP,w:212,h:196};

  // mmWave field of view: exactly 120deg, aimed down-left into the room
  // 120deg FOV; right edge (a0) aimed just past the bed's bottom-left corner,
  // a few px clear of it rather than exactly on it.
  const bedCorner={x:bed.x-6, y:bed.y+bed.h+6};
  const CONE={ half:Math.PI/3, edge:0.10 };
  CONE.center=Math.atan2(bedCorner.y-lamp.y, bedCorner.x-lamp.x)+CONE.half;
  const a0=CONE.center-CONE.half, a1=CONE.center+CONE.half;

  const modes={
    follow:"A column of light tracks your position and widens as you move closer.",
    dimAway:"Brightness fades as you walk away. Leave the room and it sleeps.",
    dimToward:"Brightness fades as you move toward the lamp, brightest from across the room.",
    shadow:"The lamp fills the room and casts a dark column toward you, widening as you approach."
  };

  let mode='follow';   // Lighthouse first (Owen, 4 Nov 2026)
  let cursor={x:250+BUF_X,y:330+BUF_TOP};
  let pointerOn=true;
  let pointerMoved=false;   // set by a pointer event, read and cleared once per frame
  let scale=1;
  const s={bright:0, beam:0, ang:CONE.center};

  function postHeight(){
    // Report the ACTUAL content height (the .wrap box = canvas, plus the static
    // UI only on the mobile stacked layout). Do NOT Math.max with
    // documentElement.scrollHeight: once the parent sets the iframe height, the
    // document grows to match it, so maxing them ratcheted the reported height
    // upward and it got stuck taller (adding white space between sections that
    // never shrank back, even when zoom returned). .wrap's border box ignores
    // the absolutely-positioned overlay, so this stays stable.
    var wrap = document.querySelector('.wrap');
    var h = wrap ? Math.ceil(wrap.getBoundingClientRect().height) : document.body.scrollHeight;
    if(window.parent !== window) window.parent.postMessage({type:'mechHeight', height:h}, '*');
  }

  function resize(){
    const cssW=canvas.parentElement.clientWidth;
    /* DPR cap lowered 2.5 -> 2, and the total backing store capped as well.
       This canvas is 940 x 960 logical units and every single frame repaints
       ALL of it, including two or three fresh radial gradients. At dpr 2.5 on
       a wide window that was ~5 million pixels per frame, which is what the
       choppiness was - not the animation logic. dpr 2 is already past the
       point where anyone can see the difference on this line art. */
    const dpr=Math.min(window.devicePixelRatio||1,2);
    let w=Math.round(cssW*dpr), h=Math.round(cssW*(H/W)*dpr);
    const MAX_PX=2600000;                       // hard ceiling on area
    if(w*h>MAX_PX){ const k=Math.sqrt(MAX_PX/(w*h)); w=Math.round(w*k); h=Math.round(h*k); }
    canvas.style.width=cssW+'px';
    canvas.width=w;
    canvas.height=h;
    scale=canvas.width/W;
    ledLayout(cssW/W);
    wake();          // size changed, so one repaint is owed
    postHeight();
  }
  // no clamp: cursor may leave the room
  function toLogical(cx,cy){
    const r=canvas.getBoundingClientRect();
    return { x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H };
  }

  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  function smoothstep(e0,e1,x){const t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t);}
  function ease(c,t,tau,dt){return reduce?t:c+(t-c)*(1-Math.exp(-dt/tau));}
  /* 14 Nov 2026 (the KART "crash"): angles are wrapped with arithmetic, never a while loop. A frame whose
     timestamp came before the loop's restart gave a NEGATIVE dt, the ease then threw the angle to about 1e18,
     where d-=2*PI changes nothing, and the while loop never ended: the whole tab froze. dt is also clamped to 0..0.05 s. */
  function wrapPi(d){ d=(d+Math.PI)%(2*Math.PI); if(d<0) d+=2*Math.PI; return d-Math.PI; }
  // ease an angle along the shortest path (avoids a full spin at the +/-PI seam)
  function easeAngle(c,t,tau,dt){
    if(reduce || !isFinite(c)) return t;
    return wrapPi(c+wrapPi(t-c)*(1-Math.exp(-dt/tau)));
  }
  function inRoom(p){return p.x>=ROOM.x&&p.x<=ROOM.x+ROOM.w&&p.y>=ROOM.y&&p.y<=ROOM.y+ROOM.h;}
  // angular presence, soft at the cone edges (wrap-safe)
  function angDiff(a,b){return Math.abs(wrapPi(a-b));}
  function coneFactor(ang){
    const off=angDiff(ang,CONE.center);
    return 1-smoothstep(CONE.half-CONE.edge,CONE.half+CONE.edge,off);
  }
  function wedge(cx,cy,as,ae,len){ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,len,as,ae);ctx.closePath();}

  function radialGlow(k){
    if(k<=0.001)return;
    const r=34+326*k, a=0.18+0.62*k;
    const g=ctx.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,r);
    g.addColorStop(0,`rgba(255,168,66,${a})`);
    g.addColorStop(0.45,`rgba(255,142,44,${a*0.55})`);
    g.addColorStop(1,'rgba(255,142,44,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  // soft-edged beam built from non-overlapping angular slices (gradient sides, no hard line)
  const SLICES=28;
  function beamSweep(ang,half,len,k,paint){
    for(let i=0;i<SLICES;i++){
      const fa=i/SLICES, fb=(i+1)/SLICES;
      const as=ang-half+2*half*fa;
      const ae=ang-half+2*half*fb;
      const x=((fa+fb)/2)*2-1;                 // -1..1 across width
      const prof=0.5*(1+Math.cos(Math.PI*x));   // 1 at centre -> 0 at edges
      paint(as,ae,prof*k);
    }
  }

  function lighthouse(ang,half,len,k){
    if(k<=0.001)return;
    beamSweep(ang,half,len,k,(as,ae,p)=>{
      ctx.save(); wedge(lamp.x,lamp.y,as,ae,len); ctx.clip();
      const g=ctx.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,len);
      g.addColorStop(0,`rgba(255,182,78,${0.95*p})`);
      g.addColorStop(0.5,`rgba(255,146,46,${0.5*p})`);
      g.addColorStop(1,'rgba(255,140,40,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
    });
    const b=ctx.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,42);
    b.addColorStop(0,`rgba(255,195,95,${0.7*k})`); b.addColorStop(1,'rgba(255,195,95,0)');
    ctx.fillStyle=b; ctx.fillRect(0,0,W,H);
  }

  function shadow(ang,half,len,k){
    if(k<=0.001)return;
    radialGlow(k);                       // ambient fill
    beamSweep(ang,half,len,k,(as,ae,p)=>{ // carve a soft-sided shadow
      ctx.save(); ctx.globalCompositeOperation='destination-out';
      wedge(lamp.x,lamp.y,as,ae,len); ctx.clip();
      const g=ctx.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,len);
      g.addColorStop(0,`rgba(0,0,0,${0.45*p})`);
      g.addColorStop(0.2,`rgba(0,0,0,${0.96*p})`);
      g.addColorStop(1,`rgba(0,0,0,${0.98*p})`);
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
    });
  }

  function lineArt(){
    ctx.lineWidth=1.2; ctx.strokeStyle=INK; ctx.lineJoin='round';
    // radar cone, clipped to the room so it reads as a bounded sensing area
    ctx.save();
    ctx.beginPath(); ctx.rect(ROOM.x,ROOM.y,ROOM.w,ROOM.h); ctx.clip();
    ctx.strokeStyle=INK_SOFT; ctx.lineWidth=1;
    const fr=900;
    ctx.beginPath();
    ctx.moveTo(lamp.x,lamp.y); ctx.lineTo(lamp.x+Math.cos(a0)*fr,lamp.y+Math.sin(a0)*fr);
    ctx.moveTo(lamp.x,lamp.y); ctx.lineTo(lamp.x+Math.cos(a1)*fr,lamp.y+Math.sin(a1)*fr);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(lamp.x,lamp.y,150,a0,a1); ctx.stroke();
    ctx.restore();
    // bed
    ctx.strokeRect(bed.x,bed.y,bed.w,bed.h);
    const pw=(bed.w-30)/2;
    ctx.strokeRect(bed.x+10,bed.y+12,pw,46);
    ctx.strokeRect(bed.x+20+pw,bed.y+12,pw,46);
    ctx.beginPath(); ctx.moveTo(bed.x+8,bed.y+78); ctx.lineTo(bed.x+bed.w-8,bed.y+78); ctx.stroke();
    // lamp: the red dot only, no square around it (Owen, 16 Nov 2026: "it should just be a circle")
    ctx.beginPath(); ctx.arc(lamp.x,lamp.y,LED.dot0,0,Math.PI*2); ctx.fillStyle='#e2191b'; ctx.fill();
  }

  /* THE LAMP SYMBOL'S SIZE: sized from the canvas's CSS scale (ledLayout(),
     called from resize()) so it reads at phone width: the red dot 1.5x the original 4.5 units
     (Owen, 4 Nov 2026). The square round it is no longer drawn (16 Nov 2026), so its side (LED.lamp) is gone too. */
  const LED={dot0:6.75};
  function ledLayout(cssScale){
    const u=1/Math.max(cssScale,0.05);                 // logical units per CSS px
    LED.dot0=Math.max(6.75,4.8*u);
  }

  function drawPerson(detected){
    ctx.save(); ctx.translate(cursor.x,cursor.y);
    ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fillStyle=PAPER; ctx.fill();
    ctx.lineWidth=1.4; ctx.strokeStyle=detected?'#e2191b':INK; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,2.4,0,Math.PI*2); ctx.fillStyle=detected?'#e2191b':INK; ctx.fill();
    ctx.restore();
  }

  /* ---------- RUN ONLY WHEN THERE IS SOMETHING TO SHOW ----------
     This loop used to run forever: every frame it cleared a multi-million-pixel
     canvas, built fresh radial gradients, and redrew the whole room - even when
     the pointer was elsewhere, the eased values had long since settled and
     nothing on screen was changing, and even when the graphic had been scrolled
     past entirely.

     Two gates now. `visible` is set by the parent page (see the
     IntersectionObserver in project.html) and shuts the loop down when the
     graphic is off screen or the tab is hidden. `settled` stops it once the
     eased values have converged and the pointer is idle - any interaction calls
     wake() and it picks straight back up. The animation is unchanged; it simply
     stops paying for frames nobody is looking at. */
  let running=false, visible=true, idleFrames=0;
  function wake(){
    idleFrames=0;
    if(!running && visible){ running=true; lastT=performance.now(); requestAnimationFrame(frame); }
  }
  window.addEventListener("message",function(ev){
    const d=ev.data;
    if(!d || d.type!=="mechVisible") return;
    visible=!!d.visible;
    if(visible) wake();
  });
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ visible=false; } else { visible=true; wake(); }
  });

  let lastT=performance.now();
  function frame(now){
    const dt=Math.max(0,Math.min(0.05,(now-lastT)/1000)); lastT=now;
    if(!visible){ running=false; return; }

    const ang=Math.atan2(cursor.y-lamp.y,cursor.x-lamp.x);
    const d=dist(cursor,lamp);
    const inside = pointerOn && inRoom(cursor);
    const present = inside ? coneFactor(ang) : 0;

    const dmax=Math.hypot(ROOM.w,ROOM.h)*0.82;
    const t=Math.min(d/dmax,1), w=1-t;
    // dimAway: bright near, fades as you leave. dimToward: bright far, fades as you approach.
    const distInten=(mode==='dimAway')?w:(mode==='dimToward')?t:0;

    // beam half-angle scales with distance: wider near, narrower far
    const lhHalf=0.04+0.82*w;   // far edge unchanged, ~2x wider right next to the lamp
    const shHalf=0.03+0.67*w;

    const isDim=(mode==='dimAway'||mode==='dimToward');
    const brightTarget=isDim?present*distInten:0;
    const beamTarget=(mode==='follow'||mode==='shadow')?present:0;

    const pb=s.bright, pm=s.beam, pa=s.ang;
    s.bright=ease(s.bright,brightTarget,0.35,dt);
    s.beam=ease(s.beam,beamTarget,0.30,dt);
    if(present>0.02) s.ang=easeAngle(s.ang,ang,0.12,dt);

    // Has anything actually moved this frame? Thresholds are well below one
    // display step, so "settled" always means visually identical, never a
    // visible freeze part-way through a fade.
    const moved = Math.abs(s.bright-pb)>0.0005 ||
                  Math.abs(s.beam-pm)>0.0005 ||
                  Math.abs(s.ang-pa)>0.0008;
    // the cursor marker follows the pointer, so a MOVING pointer is never
    // idle. A pointer parked on the room is: it used to keep idleFrames at 0
    // (pointerOn starts true), so a reader with the mouse resting on the
    // drawing paid 60 fps for a still picture, touch devices included.
    // pointerMoved is set by the pointer handlers and cleared here, so the
    // loop stands down 12 frames after the last movement either way.
    idleFrames = (moved || pointerMoved) ? 0 : idleFrames+1;
    pointerMoved = false;

    ctx.setTransform(scale,0,0,scale,0,0);
    // transparent background: clear only. No paper fill, so only the lines,
    // glow and cursor draw and the (flooding) 3D model shows through behind.
    ctx.clearRect(0,0,W,H);

    ctx.save();
    if(isDim) radialGlow(s.bright);
    else if(mode==='follow') lighthouse(s.ang,lhHalf,540,s.beam);
    else if(mode==='shadow') shadow(s.ang,shHalf,560,s.beam);
    ctx.restore();

    lineArt();
    if(pointerOn) drawPerson(present>0.5);

    // ~12 still frames (a fifth of a second) before standing down, so a brief
    // pause mid-gesture never costs a restart
    if(idleFrames > 12){ running=false; return; }
    requestAnimationFrame(frame);
  }

  document.getElementById('modes').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    mode=b.dataset.mode;
    [...e.currentTarget.querySelectorAll('button')].forEach(x=>
      x.setAttribute('aria-pressed',x===b?'true':'false'));
    descEl.textContent=modes[mode];
    wake();
  });
  // listen on the whole stage (canvas + the overlaid UI), not just the canvas,
  // so moving over the mode buttons keeps tracking the cursor and drawing the
  // custom marker instead of stopping the moment the pointer hits a control.
  const stage=document.querySelector('.stage');
  stage.addEventListener('pointermove',e=>{cursor=toLogical(e.clientX,e.clientY); pointerOn=true; pointerMoved=true; wake();});
  stage.addEventListener('pointerdown',e=>{cursor=toLogical(e.clientX,e.clientY); pointerOn=true; pointerMoved=true; wake();});
  stage.addEventListener('pointerleave',()=>{ pointerOn=false; pointerMoved=true; wake(); });
  stage.addEventListener('pointerenter',()=>{ pointerOn=true; pointerMoved=true; wake(); });
  window.addEventListener('resize',resize);

  descEl.textContent=modes[mode];
  resize();
  wake();

  window.addEventListener("load", postHeight);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);
  setTimeout(postHeight, 300);
  if(window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

  /* the DRAG / TOUCH TO INTERACT label and tap to wake on touch: js/mech-touch.js (Owen, 14 Nov 2026) */
})();
</script>
