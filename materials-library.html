  .matcat-intro{display:grid; grid-template-columns:repeat(12,1fr); column-gap:var(--gut); align-items:start;

<script>
(function(){
  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function real(s){ return s && String(s).trim() !== ""; }
  var root = document.getElementById("matg-cats");

  // one media figure. The colour-swatch fallback is baked into the figure's
  // own background (see CSS); if the photo 404s, onerror removes the <img> and
  // the swatch shows through, so a missing image never breaks the layout.
  // The src is held in data-src and set only when the section opens (loadImgs
  // below): the accordion hides content with display:none, and browsers never
  // fetch a loading="lazy" image inside a display:none subtree, so we defer and
  // load on reveal instead. This also keeps hidden sections from loading.
  function media(cls, file, alt){
    return '<figure class="'+cls+'"><img data-src="materials/'+esc(file)+'" alt="'+esc(alt)+'" decoding="async" onerror="this.remove()"></figure>';
  }
  function loadImgs(scope){
    if(!scope) return;
    scope.querySelectorAll('img[data-src]').forEach(function(img){
      img.src = img.getAttribute("data-src");
      img.removeAttribute("data-src");
    });
  }

  /* USED-ONLY (2026-10-01). This page shows only the materials that appear in
     a project's material chips, and "Used in" is worked out here from
     js/projects-data.js instead of being typed by hand in materials-data.js
     (the hand-typed flags had drifted: borosilicate and foam were marked unused
     while AMSALP and NEB used them). A chip matches by the material's name or
     any of its aliases, the same rule project pages use to link chips here.
     materials-library.html is generated from this file with SHOW_ALL = true
     (tools/make-materials-library.py) and lists everything. */
  var SHOW_ALL = true;
  var CATS = (function(){
    var P = (typeof PROJECTS !== "undefined") ? PROJECTS : {};
    var byName = {};
    MATERIAL_CATEGORIES.forEach(function(cat){ cat.groups.forEach(function(g){ g.items.forEach(function(it){
      it.usedIn = []; it.used = false;
      byName[String(it.name).toLowerCase()] = it;
      (it.aliases || []).forEach(function(a){ byName[String(a).toLowerCase()] = it; });
    }); }); });
    Object.keys(P).forEach(function(id){
      String(P[id].materials || "").split(",").forEach(function(w){
        var it = byName[w.trim().toLowerCase()];
        if(it && !it.usedIn.some(function(u){ return u.id === id; })){
          it.usedIn.push({ id:id, title:P[id].title || id.toUpperCase() }); it.used = true;
        }
      });
    });
    if(SHOW_ALL) return MATERIAL_CATEGORIES;
    return MATERIAL_CATEGORIES.map(function(cat){
      var c = Object.assign({}, cat);
      c.groups = cat.groups.map(function(g){
        var o = Object.assign({}, g); o.items = g.items.filter(function(it){ return it.used; }); return o;
      }).filter(function(g){ return g.items.length; });
      return c;
    }).filter(function(c){ return c.groups.length; });
  })();

  var html = CATS.map(function(cat, catIndex){
    var total = cat.groups.reduce(function(a,g){ return a + g.items.length; }, 0);
    var groupNames = cat.groups.map(function(g){ return g.label; }).join("  /  ");

    // Properties + lifecycle only. "Finishes" was dropped by request: it is the
    // least useful of the three at a glance, and with the text block now sized
    // to sit flush with the image, two blocks is what fits cleanly.
    // cat.intro.finishes is still in the data, simply unused.
    var introText = [
      real(cat.intro.properties) ? '<p class="desc"><span class="mi-k">Properties</span>'+esc(cat.intro.properties)+'</p>' : '',
      real(cat.intro.lifecycle)  ? '<p class="desc"><span class="mi-k">Lifecycle</span>'+esc(cat.intro.lifecycle)+'</p>' : ''
    ].join("");
    /* The hero image is visible at rest (as the collapsed slice), so it is
       never deferred with data-src/loadImgs - that would leave a blank box on
       arrival. Material thumbnails inside the groups still defer.

       It IS served responsively now. The originals are 1200x1200 squares of
       177-630KB, and this box is 4:3 with object-fit:cover, so the browser was
       downloading a quarter of every one of them only to crop it away. The
       widths it actually renders at are 832px on a 2560 screen, 460px on a
       1440 laptop and 340px on a phone, so materials/md (1000x750) covers
       every case including 2x on a laptop, and materials/sm (600x450) covers
       phones. Run tools/make-material-variants.py after changing any of them.

       Only the first category is eager. All six used to be, which meant 2.7MB
       of category photos on arrival for five boxes you have not scrolled to
       yet. */
    var intro = '<div class="matcat-intro">' +
      '<figure class="matcat-hero '+esc(cat.swatch)+'">' +
        (cat.image ? '<img src="materials/md/'+esc(cat.image)+'"' +
          ' srcset="materials/sm/'+esc(cat.image)+' 600w, materials/md/'+esc(cat.image)+' 1000w"' +
          ' sizes="(max-width:700px) 92vw, (max-width:900px) 46vw, 32vw"' +
          ' width="1000" height="750"' +
          ' alt="'+esc(cat.label)+'" loading="'+(catIndex === 0 ? 'eager' : 'lazy')+'"' +
          ' decoding="async" onerror="this.remove()">' : '') +
      '</figure>' +
      '<div class="matcat-intro-text">'+introText+'</div></div>';

    var groups = cat.groups.map(function(g){
      var meta = [
        real(g.properties) ? '<span class="mg-k">Properties</span>'+esc(g.properties) : '',
        real(g.bestUses)   ? '<span class="mg-k">Best uses</span>'+esc(g.bestUses) : '',
        real(g.lifecycle)  ? '<span class="mg-k">Lifecycle</span>'+esc(g.lifecycle) : ''
      ].filter(Boolean).join('<span class="mg-sep">/</span>');

      var items = g.items.map(function(it){
        // the "In use" tag was removed by request: where a material is actually
        // used, the "Used in: <project>" line below says so with more
        // information and no extra visual weight. `it.used` stays in the data,
        // unused here, in case a future filter wants it.
        var usedIn = (it.usedIn && it.usedIn.length)
          ? '<span class="mi-in">Used in: '+it.usedIn.map(function(u){ return '<a href="'+esc(u.id)+'.html">'+esc(u.title)+'</a>'; }).join(", ")+'</span>'
          : '';
        return '<div class="matitem" id="'+esc(it.slug)+'">' +
                 media("matitem-media "+esc(cat.swatch), it.image, it.name) +
                 '<div class="matitem-text">' +
                   '<span class="mi-name">'+esc(it.name)+'</span>' +
                   usedIn +
                   '<p class="desc">'+esc(it.copy)+'</p>' +
                 '</div>' +
               '</div>';
      }).join("");

      // each subgroup is its own collapsible: its head (label + material-name
      // preview + count + chevron) toggles the body (meta + material grid).
      var groupPreview = g.items.map(function(it){ return it.name; }).join("  /  ");
      return '<div class="matgroup">' +
               '<button class="matgroup-head" aria-expanded="false">' +
                 '<span class="matgroup-label">'+esc(g.label)+'</span>' +
                 '<span class="matgroup-names">'+esc(groupPreview)+'</span>' +
                 '<span class="matgroup-count">'+g.items.length+'</span>' +
                 '<span class="matgroup-chev">+</span>' +
               '</button>' +
               '<div class="matgroup-body"><div class="matgroup-inner">' +
                 (meta ? '<p class="matgroup-meta">'+meta+'</p>' : '') +
                 '<div class="matgrid">'+items+'</div>' +
               '</div></div>' +
             '</div>';
    }).join("");

    // The intro (image + text) sits OUTSIDE both the head button and the
    // collapsible body, so it is always present and never moves. The button is
    // just the label row; the body holds only the subgroups. Opening the
    // category grows the image and reveals the groups beneath it.
    return '<section class="matcat">' +
             '<button class="matcat-head" aria-expanded="false">' +
               '<span class="matcat-head-row">' +
                 '<span class="cap lbl">'+esc(cat.label)+'</span>' +
                 '<span class="matcat-names">'+esc(groupNames)+'</span>' +
                 '<span class="matcat-count">'+total+(total === 1 ? ' MATERIAL' : ' MATERIALS')+'</span>' +
                 '<span class="matcat-chev">+</span>' +
               '</span>' +
             '</button>' +
             intro +
             '<div class="matcat-body"><div class="matcat-inner">'+groups+'</div></div>' +
           '</section>';
  }).join("");
  root.innerHTML = html;

  /* ---- UNIFORM PREVIEW BAND HEIGHT ------------------------------------
     Every collapsed category band is the same height, and that height is
     whatever the TALLEST properties+lifecycle block needs. Measuring is the
     only way to get both: the copy differs per category, so a hard-coded
     height would either clip the longest or leave the shortest floating in
     space, and CSS cannot size a row to the tallest of several siblings that
     live in separate sections.

     How: let each text block go to its natural height for one frame, read the
     largest, then write that back as --matcat-band on :root so every band
     (image and text alike) picks it up. Runs after the fonts settle, because
     measuring before OCR-B loads gives a height for the fallback font.
     Re-measured on resize, debounced, since the copy re-wraps at every width. */
  var cats  = [].slice.call(root.querySelectorAll(".matcat"));
  // NOTE: there is no font scaling here any more. Growing the type to fill the
  // band made it much heavier than the rest of the page; space-between in the
  // CSS aligns the block's top and bottom to the image at the normal body size.
  // How much of the hero image the collapsed state shows, as a fraction of its
  // full 4:3 height. Driven by the IMAGE, not the text: at 17% (which is what
  // the text height alone produced) the slice was so shallow it read as a flat
  // colour band rather than a photograph. Raise for a deeper slice.
  // The band height sets TWO things at once, which is why this number matters
  // more than it looks: how much photo shows, and - because the text is
  // space-between inside it - how far apart the properties and lifecycle
  // paragraphs sit. 0.22 keeps the slice clearly photographic while holding
  // that inner gap at roughly half the gap BETWEEN categories (see .matcat
  // margin-top), so the two separations read as different things. Raising this
  // pushes the two paragraphs apart; raise .matcat margin-top with it.
  var BAND_FRACTION = 0.22;

  function sizeBands(){
    if(!cats.length) return;
    if(window.matchMedia("(max-width:900px)").matches){
      // stacked layout: image and text are not side by side, so neither the
      // shared band height nor the font fitting applies. Clear both.
      document.documentElement.style.removeProperty("--matcat-band");
      cats.forEach(function(c){
        var h = c.querySelector(".matcat-hero");
        if(h) h.style.removeProperty("--matcat-full");
      });
      return;
    }

    // 1. BAND HEIGHT: one height for every collapsed category. It is a fixed
    //    fraction of the hero image's full height, so the slice always reads as
    //    a photograph, but never shorter than the tallest text block needs at
    //    the base font - otherwise the copy would be clipped.
    document.documentElement.style.setProperty("--matcat-band", "auto");
    var tallest = 0, imageBand = 0;
    cats.forEach(function(c){
      var t = c.querySelector(".matcat-intro-text");
      if(t && t.scrollHeight > tallest) tallest = t.scrollHeight;
      var hero = c.querySelector(".matcat-hero");
      if(hero) imageBand = Math.max(imageBand, hero.clientWidth * 0.75 * BAND_FRACTION);
    });
    tallest = Math.max(Math.ceil(tallest), Math.round(imageBand), 96);
    document.documentElement.style.setProperty("--matcat-band", tallest + "px");

    cats.forEach(function(c){
      // 2. FULL IMAGE HEIGHT, so the open state can transition to a real px
      //    value (CSS cannot animate height to `auto`). The image is 4:3 at
      //    100% of its column, so its full height is width * 3/4.
      var hero = c.querySelector(".matcat-hero");
      if(hero) hero.style.setProperty("--matcat-full", Math.round(hero.clientWidth * 0.75) + "px");

    });
  }

  sizeBands();
  // re-run once the real fonts are in: measuring against the fallback face
  // gives the wrong line count and therefore the wrong fitted size.
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(sizeBands);
  var bandTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(bandTimer);
    bandTimer = setTimeout(sizeBands, 150);
  });

  // click a head to expand/collapse its category. Opening one does not close
  // the others; this is a reference page, someone comparing two categories
  // shouldn't have to fight the accordion for it.
  // click a category head to reveal its description + the list of subgroups.
  // Opening it loads the category's hero image (the material thumbnails wait
  // until their own subgroup is opened).
  function toggleCat(cat, force){
    var btn = cat.querySelector(".matcat-head");
    var open = (force != null) ? force : !cat.classList.contains("open");
    cat.classList.toggle("open", open);
    if(btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
    // the hero is eager now, but the open state may still reveal the group
    // thumbnails' container - those load on their own subgroup click.
  }
  root.querySelectorAll(".matcat-head").forEach(function(btn){
    btn.addEventListener("click", function(){ toggleCat(btn.closest(".matcat")); });
  });
  // the image is part of the same control: clicking it reveals the rest of
  // itself, which is the whole gesture the collapsed slice is inviting.
  root.querySelectorAll(".matcat-hero").forEach(function(hero){
    hero.addEventListener("click", function(){ toggleCat(hero.closest(".matcat")); });
  });

  // click a subgroup head to reveal its materials (second level), loading that
  // subgroup's thumbnails.
  root.querySelectorAll(".matgroup-head").forEach(function(btn){
    btn.addEventListener("click", function(){
      var g = btn.closest(".matgroup");
      var open = !g.classList.contains("open");
      g.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if(open) loadImgs(g.querySelector(".matgroup-body"));
    });
  });

  // deep-link support: materials.html#<slug> opens that material's category
  // AND its subgroup, then scrolls to it, so a material chip on a project page
  // can point straight at the right entry through both accordion levels.
  if(location.hash){
    var target = document.getElementById(location.hash.slice(1));
    if(target){
      var cat = target.closest(".matcat");
      if(cat){ toggleCat(cat, true); }
      var grp = target.closest(".matgroup");
      if(grp){ grp.classList.add("open"); var gh=grp.querySelector(".matgroup-head"); if(gh) gh.setAttribute("aria-expanded","true"); loadImgs(grp.querySelector(".matgroup-body")); }
      setTimeout(function(){ target.scrollIntoView({block:"center"}); }, 300);
    }
  }

  /* materials.html?for=kart : arriving from a project page (its material
     chips or its MATERIAL GUIDE link) opens every category and subgroup that
     holds a material that project uses, so the visitor lands on that
     project's materials already unfolded. With a #slug as well, the block
     above has scrolled to the one that was clicked; without, scroll to the
     first. "Used in" was worked out per material when CATS was built. */
  var FOR = "";
  try { FOR = (new URLSearchParams(location.search).get("for") || "").toLowerCase().replace(/[^a-z0-9_-]/g, ""); } catch(e){}
  if(FOR){
    var firstHit = null;
    MATERIAL_CATEGORIES.forEach(function(cat){ cat.groups.forEach(function(g){ g.items.forEach(function(it){
      if(!(it.usedIn || []).some(function(u){ return u.id === FOR; })) return;
      var el = document.getElementById(it.slug);
      if(!el) return;
      var c = el.closest(".matcat"), gr = el.closest(".matgroup");
      if(c) toggleCat(c, true);
      if(gr){ gr.classList.add("open"); var h = gr.querySelector(".matgroup-head"); if(h) h.setAttribute("aria-expanded", "true"); loadImgs(gr.querySelector(".matgroup-body")); }
      el.classList.add("is-for");
      if(!firstHit) firstHit = el;
    }); }); });
    if(firstHit && !location.hash){
      var fc = firstHit.closest(".matcat") || firstHit;
      setTimeout(function(){ window.scrollTo(0, Math.max(0, fc.getBoundingClientRect().top + window.pageYOffset - 96)); }, 350);
    }
  }
})();
</script>
</body>
</html>
