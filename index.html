<!-- warm the loader's dependencies from the first byte of HTML, but ONLY on a
     page this session has not shown the tumble on yet. The 3D logo tumble runs
     in a worker that needs three.js and the STL, and preloading them from the
     head is what keeps the animation from stuttering on a fresh tab.
     These used to be two plain <link rel="preload"> tags, which fire before any
     script runs - so 589KB of three.js and a 177KB STL were fetched on every
     page view, including the revisits where loader3d.js deliberately never
     starts the 3D path at all (see deferredKickoff / REVISIT_HOLD_MS there).
     Chrome flagged it: "preloaded using link preload but not used within a few
     seconds from the window's load event".
     The key below MUST match pageKey() in js/loader3d.js. If the page turns out
     to be slow on a revisit, loader3d.js loads three.js itself exactly as
     before - the preload was only ever a warm-up, never the loading path. -->
<script>
(function(){
  try{
    var p = new URLSearchParams(location.search).get("p") || "";
    var k = "newo:seen:" + location.pathname + (p ? "?p=" + p : "");
    // same key and 24 h rule as seenBefore() in js/loader3d.js
    var t = parseInt(localStorage.getItem(k), 10);
    if(t && (Date.now() - t) < 24 * 60 * 60 * 1000) return;   // tumble is skipped here
  }catch(e){}                                       // no storage: treat it as a first view
  /* 2026-11-03: the worker fetches loader3d-core/-mesh itself; a document preload
     is not shared with a worker, so it only downloaded them twice. */
  /* 2026-10-26: a first view will show the 3D logo, so keep the flat one
     hidden from the very first paint (it used to show for a moment before
     js/loader3d.js arrived, then swap). loader3d.js removes this at once and
     takes over; if it never runs, the flat mark fades in at 1.2s anyway. */
  try {
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if(navigator.connection && navigator.connection.saveData) return;
    var st = document.createElement("style");
    st.id = "ld-3d-first";
    st.textContent = ".ld-logo{opacity:0;animation:ldFlatLate .22s ease 1.2s forwards}@keyframes ldFlatLate{to{opacity:1}}";
    document.head.appendChild(st);
  } catch(e){}
})();
</script>

<!--
  STUDIO NEWO · home / index (16 Nov 2026; one screen, 19 Nov 2026)
  The editorial gallery: the products as photos of different sizes on a
  12-column grid, on ONE SCREEN with no scroll on a desktop (Owen's A2 picks,
  19 Nov 2026, docs/SITE_REVIEW_2026-11-18.txt "A2 FINAL"): a statement at
  body size above the third photo, its top level with the top of the largest;
  each tile's name, kind and year in one 150px box; two gutters of white
  between photos; one link to all projects. Built from mock-home.html.
  No sky behind the page and no weather windows (those stay parked in
  home-test.html?v=e). The loading screen is the one the project pages use
  (the logo on the page colour; no sky since 19 Nov 2026).

  Which product is large: the RANK list in the script at the bottom.
  Where things sit: the LAYOUT list under it. The statement: WORDS, beside
  them. Copy: js/projects-data.js.
  The page before this one (the scrolling gallery, name and year only) is in
  _backup_originals/2026-11-19_home_all_projects/index.html.
-->
<style>
/* ---- HOME PAGE ONLY. Fonts, tokens, loader, header marks, menu, skip link
   and .vh come from css/style.css and are not re-declared here.

   THE GRID. 12 columns and 8 rows, outer margin --m. One row is 3/4 of a
   column, so a 4:3 photo N columns wide is N rows tall. Over 900 wide the
   whole grid fits the window: the column is the smaller of "what the width
   allows" and "what the height allows"; when the height is the limit, the
   spare width goes into column 7 (the empty one between the big photo and
   the group at the right), so the photos keep both page margins. Column 7
   is never narrower than a label box. Where each tile sits is data (RANK
   and LAYOUT in the script), never per-product CSS.
   TYPE: the statement is body (10.5px, 11px on a phone), kind and year are
   labels (8.5px, .08em), the names GOST 19px. Nothing else. ---- */
body.home{--m:clamp(16px,1.67vw,32px); --g:clamp(10px,1.1vw,20px);
  --mar-edge:var(--m);   /* the logo and the burger stand on the content's own margin: one edge for everything (same size and top as on every page) */
  font-size:10.5px; line-height:1.36; letter-spacing:0; min-height:100vh; overflow-x:clip;}
@media (max-width:760px){ body.home{font-size:11px;} }
/* one screen: nothing to scroll to. A window under 640px tall keeps its scroll (the grid stops shrinking there). */
@media (min-width:901px) and (min-height:640px){ body.home{overflow-y:hidden;} }

.ix-wrap{container-type:inline-size; margin:0 var(--m); box-sizing:border-box;
  --vh:max(100svh, 640px);
  --lw:150px;                         /* the label box, every tile */
  --G:calc(var(--g) * 2);             /* white between photos: two gutters (Owen 19 Nov, "more breathing room") */
  --stn:0px;                          /* height the statement needs above the photo under it, set by fitStatement() */
  --top:calc(var(--hdr-top) + var(--hdr) + clamp(20px,2.4vw,40px)); --bot:48px;
  height:var(--vh); padding-top:var(--top);}
.ix{--rg:calc(var(--G) * .75);
  --cw:min((100cqw - 11 * var(--G)) / 12, (100cqw - 11 * var(--G) - var(--lw)) / 11);
  --hav:calc(var(--vh) - var(--top) - var(--bot));
  /* 8 rows of .75 column; row 1 grows if the statement needs more than one row */
  --ch:min((var(--hav) - 7 * var(--rg)) / 6, (var(--hav) - 6 * var(--rg) - var(--stn)) / 5.25);
  --c:min(var(--cw), var(--ch)); --r:calc(var(--c) * .75);
  display:grid; column-gap:var(--G); row-gap:var(--rg);
  grid-template-columns:repeat(6, var(--c)) minmax(max(var(--c), var(--lw)), 1fr) repeat(5, var(--c));
  grid-template-rows:max(var(--r), var(--stn) - var(--rg)) repeat(7, var(--r));}
.ix:focus{outline:none;}
.ix > *{grid-column:var(--col) / span var(--span); grid-row:var(--row) / span var(--rows); align-self:start; min-width:0;}

/* a product tile: the box is the photo only, the words hang outside it */
.tl{position:relative; display:block; color:var(--ink); text-decoration:none; height:100%;}
/* GROWING FRAMES (Owen, 14 Nov 2026): on hover or keyboard focus the FRAME
   grows, the photo staying fitted inside it. Transform only; --grow (set per
   tile in the script) makes every frame 16px wider whatever its size. It grows
   from its bottom edge: up and to both sides, never down into the name under
   it. No will-change, nothing toggled on hover. */
.tl-im{display:block; overflow:hidden; height:100%; transform:scale(1); transform-origin:50% 100%; transition:transform .45s cubic-bezier(.2,.8,.2,1); backface-visibility:hidden;}
.tl-im img{display:block; width:100%; height:100%; object-fit:cover; transform:scale(1.01); backface-visibility:hidden;}
@media (hover:hover){
  .tl:hover .tl-im{transform:scale(var(--grow, 1.02));}
  .tl:hover{z-index:2;}
}
.tl:focus-visible{outline:none; z-index:2;}
.tl:focus-visible .tl-im{transform:scale(var(--grow, 1.02)); outline:2px solid var(--ink); outline-offset:2px;}   /* the site focus ring */

/* THE LABEL (Owen, 19 Nov 2026): name, kind, year, each on its own line, in
   one box of the same width on every tile, always one gutter (--g) from its
   photo. Where it goes is `cap` in LAYOUT:
   under the photo on its left edge (default); "ur" under it on its right
   edge, words set right; "l" beside it at the left, last line on the photo's
   bottom edge, words set right; "r" the same at the right, words set left. */
.tl-cap{position:absolute; left:0; top:calc(100% + var(--g) - 3px); width:var(--lw); display:flex; flex-direction:column; align-items:flex-start; gap:2px;}
.tl-n{font-family:var(--disp); font-style:italic; font-size:19px; line-height:1; letter-spacing:0; margin-bottom:3px;}
.tl-k, .tl-y{font-size:8.5px; line-height:1.3; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2);}
.tl-k{text-wrap:balance;}   /* even lines, no single word left alone */
.cap-ur .tl-cap{left:auto; right:0; align-items:flex-end; text-align:right;}
.cap-l .tl-cap{top:auto; bottom:-2px; left:auto; right:calc(100% + var(--g)); align-items:flex-end; text-align:right;}
.cap-r .tl-cap{top:auto; bottom:-2px; left:calc(100% + var(--g));}

/* THE STATEMENT (Owen, 19 Nov 2026): body size, above the photo under it on
   that photo's left edge, the top of its capitals level with the top of the
   largest photo. The link to all projects sits under it, a text link. */
.ix-st{color:var(--ink);}
.ix-st p{margin:-3px 0 0; font:inherit; max-width:min(36ch, 100%); text-align:justify; text-align-last:left;}   /* 36ch = three even lines */
.ix-all{display:inline-block; margin-top:10px; padding:2px 0; font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
  color:var(--red-text); text-decoration:none;}
.ix-all:hover, .ix-all:active{text-decoration:underline; text-decoration-color:var(--red); text-decoration-thickness:1px; text-underline-offset:4px;}
.ix-all:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

/* reveal: opacity only. While js/loader3d.js holds the logo (body.ld-pinned)
   nothing else shows; the page comes up as the mark lets go. */
.ix > *{opacity:0; transition:opacity .6s ease;}
body.ready .ix > *{opacity:1;}
body.ready.ld-pinned .ix > *{opacity:0;}
@media (prefers-reduced-motion:reduce){
  .tl-im{transition:none;} .tl:hover .tl-im, .tl:focus-visible .tl-im{transform:none;}
}

/* phone and narrow windows: six columns, one thing a row, the same size contrast; it scrolls */
@media (max-width:900px){
  .ix-wrap{height:auto; padding-top:calc(var(--hdr-top) + var(--hdr) + 28px); padding-bottom:72px;}
  .ix{--c:calc((100cqw - 5 * var(--g)) / 6); grid-template-columns:repeat(6,minmax(0,1fr)); grid-template-rows:none; grid-auto-rows:auto; column-gap:var(--g); row-gap:40px;}
  .ix > *{grid-column:var(--pcol) / span var(--pspan); grid-row:var(--prow);}
  .tl{height:auto;} .tl-im{height:auto; aspect-ratio:4 / 3;}
  .tl-cap, .cap-l .tl-cap, .cap-r .tl-cap{position:static; align-items:flex-start; text-align:left; margin-top:var(--g);}
  .cap-ur .tl-cap{position:static; margin-top:var(--g); margin-left:calc(100% - var(--lw));}
  .ix-st p{max-width:46ch;}
}
</style>

/* LAST-RESORT REVEAL (2026-10-05). main.js holds the 12s hard cap, so if main.js

<script>
(function(){
  "use strict";
  /* ==========================================================================
     RANK. Best project first. The first name gets the biggest place on the
     page (slot 1), the second the next biggest, and so on. Reorder this one
     list to change which product is large. To try an order without editing:
       index.html?rank=neb,kart,omni,halo,flow
     ========================================================================== */
  var RANK = ["kart", "neb", "omni", "halo", "flow"];
  (function(){
    var r = "";
    try { r = new URLSearchParams(location.search).get("rank") || ""; } catch(e){}
    r = r.split(",").filter(function(k){ return PROJECTS[k]; });
    if(r.length) RANK = r.concat(RANK.filter(function(k){ return r.indexOf(k) < 0; }));
  })();

  /* ==========================================================================
     LAYOUT. Where things sit. One entry per thing on the page.
       slot   a product place: 1 is the biggest, filled from RANK
       id     "words" = the statement and the link to all projects
       col    first column, 1 to 12        span   columns wide
       row    first row, 1 to 8 (a row is 3/4 of a column, so a photo N
              columns wide is N rows tall; photos are cropped to 4:3)
       rows   only for "words": rows tall (photos work theirs out)
       cap    where name, kind and year go: under the photo on its left edge
              (default), "ur" = under it on its right edge, "l" or "r" =
              beside it at that side, last line on the photo's bottom edge
       ph     phone: [row, first column, columns wide] on a six-column grid
     The page is one screen: the 12 columns and 8 rows are all there is, so a
     new place must fit inside them. The statement must stay in row 1 (row 1
     grows to hold it, fitStatement() below).
     ========================================================================== */
  var LAYOUT = [
    { slot:1,     col:1,  span:6, row:1,                    ph:[2,1,6] },
    { id:"words", col:8,  span:3, row:1, rows:1,            ph:[1,1,6] },
    { slot:4,     col:11, span:2, row:1, cap:"ur",          ph:[3,5,2] },
    { slot:3,     col:8,  span:3, row:2, cap:"l",           ph:[4,1,3] },
    { slot:5,     col:5,  span:2, row:7, cap:"l",           ph:[5,4,2] },
    { slot:2,     col:9,  span:4, row:5, cap:"l",           ph:[6,3,4] }
  ];
  /* THE STATEMENT. PLACEHOLDER wording from the mock-up (19 Nov 2026): Owen has
     not written or approved it yet. Third person, sentence case. */
  var WORDS = "Industrial design studio, Toronto. Lighting, furniture and audio built to be opened, repaired and kept.";
  var ALL_PROJECTS = "all-projects.html";

  function real(s){ return s && String(s).charAt(0) !== "["; }
  function esc(s){ return (s == null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  /* does this IMG_SIZES entry have the sm/ or md/ copy? Optional third element
     from tools/make-image-variants.py; without it, the width rule. */
  function hasTier(d, t){
    return d.length > 2 ? (" " + d[2] + " ").indexOf(" " + t + " ") >= 0 : d[0] > (t === "sm" ? 600 : 1200);
  }
  /* the sm / md / full ladder, sized to the tile: its share of the 12 columns
     (of the 6 on a phone). Dimensions come from js/image-sizes.js; no entry
     means no srcset and the plain src, so a new photo can never break this. */
  function srcAttrs(key, file, it){
    var d = (typeof IMG_SIZES !== "undefined" && IMG_SIZES[key]) ? IMG_SIZES[key][file] : null;
    if(!d) return "";
    var b = "projects/" + key + "/", set = [];
    if(hasTier(d, "sm")) set.push(b + "sm/" + file + " 600w");
    if(hasTier(d, "md")) set.push(b + "md/" + file + " 1200w");
    set.push(b + file + " " + d[0] + "w");
    var sizes = "(max-width:900px) " + Math.round(it.ph[2] / 6 * 100) + "vw, " + Math.round(it.span / 12 * 100) + "vw";
    return (set.length > 1 ? ' srcset="' + set.join(", ") + '" sizes="' + sizes + '"' : "") + ' width="' + d[0] + '" height="' + d[1] + '"';
  }
  function place(el, it, rows){
    el.style.setProperty("--col", it.col);   el.style.setProperty("--span", it.span);
    el.style.setProperty("--row", it.row);   el.style.setProperty("--rows", rows);
    el.style.setProperty("--prow", it.ph[0]);
    el.style.setProperty("--pcol", it.ph[1]); el.style.setProperty("--pspan", it.ph[2]);
  }

  /* WARMING THE PROJECT PAGES: window.NEWO_WARM in js/menu.js (read the note
     there). The shared shell once the page has settled; each project when the
     pointer or the keyboard lands on its tile. */
  var WARM = window.NEWO_WARM || { shell:function(){}, project:function(){}, page:function(){} };
  var whenIdle = window.requestIdleCallback || function(fn){ return setTimeout(fn, 1500); };
  whenIdle(function(){ WARM.shell(); });

  var ix = document.getElementById("content");
  LAYOUT.forEach(function(it){
    var el, key = it.slot ? RANK[it.slot - 1] : null;
    if(it.id === "words"){
      el = document.createElement("div");
      el.className = "ix-st";
      el.innerHTML = "<p>" + esc(WORDS) + '</p><a class="ix-all" href="' + ALL_PROJECTS + '">All projects &rarr;</a>';
      place(el, it, it.rows || 1);
      (function(a){
        function warm(){ if(WARM.page) WARM.page(ALL_PROJECTS); }
        a.addEventListener("pointerenter", warm); a.addEventListener("focus", warm);
      })(el.querySelector("a"));
    } else {
      var p = PROJECTS[key]; if(!p) return;
      var file = (p.gallery && p.gallery[0]) ? p.gallery[0] : "hero.jpg";
      el = document.createElement("a");
      el.className = "tl" + (it.cap === "r" || it.cap === "l" || it.cap === "ur" ? " cap-" + it.cap : "");
      el.href = key + ".html";
      /* not lazy: the tiles are the page */
      el.innerHTML =
        '<span class="tl-im"><img src="projects/' + key + '/' + file + '"' + srcAttrs(key, file, it) +
          ' alt="' + esc((p.alt && p.alt[file]) || p.title) + '" decoding="async"></span>' +
        '<span class="tl-cap"><span class="tl-n">' + esc(p.title) + '</span>' +
          (real(p.kind) ? '<span class="tl-k">' + esc(p.kind) + '</span>' : '') +
          (real(p.date) ? '<span class="tl-y">' + esc(p.date) + '</span>' : '') + '</span>';
      /* every photo is cropped to 4:3, so N columns wide is N rows tall */
      place(el, it, it.span);
      /* pointerenter also fires on a touch, the only warning a phone gives
         before the tap lands. NEWO_WARM dedupes every URL itself. */
      (function(a, k){
        a.addEventListener("pointerenter", function(){ WARM.project(a, k); });
        a.addEventListener("focus", function(){ WARM.project(a, k); });
      })(el, key);
    }
    ix.appendChild(el);
  });

  /* GROWING FRAMES: every frame grows by the same 16px of width, whatever its
     size, so a large tile does not swell into its neighbours. */
  function sizeTiles(){
    [].forEach.call(ix.querySelectorAll(".tl-im"), function(f){
      var w = f.getBoundingClientRect().width;
      if(w) f.style.setProperty("--grow", ((w + 16) / w).toFixed(4));
    });
  }
  /* THE STATEMENT'S ROW. The statement sits in row 1 above the photo in row 2.
     If it is taller than one row, row 1 grows to hold it (--stn = its height
     + 16px of white above that photo) and the grid re-fits the screen. */
  function fitStatement(){
    var wrap = ix.parentNode, st = ix.querySelector(".ix-st"), need = 0, i, h;
    wrap.style.setProperty("--stn", "0px");
    if(!st || innerWidth <= 900) return;
    for(i = 0; i < 4; i++){
      h = Math.ceil(st.getBoundingClientRect().height) + 16;
      if(h === need) break;
      need = h; wrap.style.setProperty("--stn", need + "px");
    }
  }
  /* the tab and reading order follows the page as it is laid out (it differs
     between the 12 column and the phone layouts) */
  var laidOut = 0;
  function readingOrder(){
    var kids = [].slice.call(ix.children).filter(function(k){ return k.tagName !== "H1"; });
    var at = kids.map(function(k){ var r = k.getBoundingClientRect(); return { k:k, t:Math.round(r.top), l:Math.round(r.left) }; });
    var sorted = at.slice().sort(function(a, b){ return (a.t - b.t) || (a.l - b.l); });
    if(sorted.some(function(x, i){ return x.k !== kids[i]; })){
      if(ix.contains(document.activeElement)) return;   // never move what has focus
      sorted.forEach(function(x){ ix.appendChild(x.k); });
    }
  }
  function layout(){ fitStatement(); sizeTiles(); }
  function relayout(){ layout(); clearTimeout(laidOut); laidOut = setTimeout(readingOrder, 60); }
  addEventListener("resize", relayout);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  layout();

  /* REVEAL. Until body.ready the page is the loading mark, nothing else. It is
     held until what the visitor is about to see is really there: every photo
     downloaded and decoded, and the fonts. 4s hard cap so a slow photo can never strand
     the page on the loader. */
  var done = false;
  function reveal(){
    if(done) return; done = true;
    if(window.__revealPage) window.__revealPage(); else document.body.classList.add("ready");
    setTimeout(function(){
      ["about.html", "contact.html"].forEach(function(h){
        var l = document.createElement("link"); l.rel = "prefetch"; l.href = h; l.as = "document";
        document.head.appendChild(l);
      });
    }, 1200);
  }
  function decoded(im){ return im.decode ? im.decode().catch(function(){}) : null; }
  var imgs = [].map.call(ix.querySelectorAll("img"), function(im){
    if(im.complete) return decoded(im);
    return new Promise(function(res){
      im.addEventListener("load", res, { once:true }); im.addEventListener("error", res, { once:true });
    }).then(function(){ return decoded(im); });
  });
  var fonts = (document.fonts && document.fonts.ready) || null;
  Promise.all(imgs.concat([fonts])).then(function(){ setTimeout(reveal, 150); }, reveal);
  setTimeout(reveal, 4000);                   // hard cap
})();
/* the menu (burger, links, close on escape) is built and wired by js/menu.js */
</script>
</body>
</html>
