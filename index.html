<!--
  STUDIO NEWO · home / index
  The home IS the project index: one of the camera clips in /videos plays as
  the full-page background. Project cards live in a bottom dock: mostly
  hidden below the bottom edge of the window at rest (just a sliver of each
  image peeking up), rising on hover to sit flush with the bottom of the
  page and show the title/description. Every card is the same size and
  built straight off the PROJECTS list, so adding a project is just adding
  its key to the ORDER array in the script below, no hand-placed coordinates
  needed. Copy -> js/projects-data.js.
-->

<style>
@font-face{font-family:"GOST B";src:url("fonts/gost-typeb-italic.ttf") format("truetype");font-style:italic;font-display:swap;}
@font-face{font-family:"OCR B";src:url("fonts/ocr-b.otf") format("opentype");font-display:swap;}

:root{ --ink:#141414; --red:#e2191b; --disp:"GOST B",Georgia,serif; --body:"OCR B","Courier New",monospace; }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:var(--body); color:var(--ink); background:#e9e7e2; overflow:hidden; letter-spacing:.02em; -webkit-font-smoothing:antialiased;}

/* full-page background video: two layers of the SAME clip, self-crossfaded
   so it loops with no seam (see the script). Paper shows until the first
   frame is ready, then the video fades in over it. */
/* Height is pinned to 100lvh (LARGE viewport height), not 100%/100vh.
   On a phone the browser's address bar retracts as you scroll, which shrinks
   the viewport - and because a fixed element with inset:0 is sized off that
   viewport, the video box got shorter mid-scroll and object-fit:cover re-cropped
   it. That re-crop is what read as the background zooming while you scrolled.
   100lvh is the height with the toolbars RETRACTED and never changes, so the
   crop stays put. 100vh is the fallback for anything without lvh support. */
.bgvid{position:fixed; top:0; left:0; z-index:-1; width:100%; height:100vh; height:100lvh; object-fit:cover; opacity:0; transition:opacity 900ms ease; pointer-events:none;}
.bgvid.show{opacity:1;}

/* ---- header: real logo (left) · wordmark (centre) · hamburger (right); all the SAME height ---- */
#home{position:fixed; z-index:5; top:24px; left:34px; display:block; width:45px; height:45px; color:var(--ink); cursor:pointer;}
#home svg{width:100%; height:100%; display:block; fill:currentColor;}
#wordmark{position:fixed; z-index:5; top:24px; left:50%; transform:translateX(-50%); height:45px; color:var(--ink); pointer-events:none;}
#wordmark svg{height:100%; width:auto; display:block; fill:currentColor;}
#burger{position:fixed; z-index:50; top:24px; right:34px; width:45px; height:45px; background:none; border:0; padding:0; cursor:pointer; color:var(--ink);}
#burger svg{width:100%; height:100%; display:block; fill:currentColor;}

/* sound toggle: a small, deliberately quiet easter egg in the corner, not a
   real UI control - sound defaults OFF (the videos stay muted) and this is
   the only way to turn the ambient audio on. Low opacity at rest so it reads
   as a mark rather than a button, brightens on hover/when on so it's still
   findable. mix-blend-difference like the other fixed marks so it stays
   visible over any part of the background video. */
#soundToggle{position:fixed; z-index:6; bottom:26px; right:34px; width:20px; height:20px; background:none; border:0; padding:0; cursor:pointer; color:var(--ink); mix-blend-mode:difference; opacity:.32; transition:opacity .25s ease;}
#soundToggle:hover, #soundToggle.on{opacity:.9;}
#soundToggle svg{width:100%; height:100%; display:block;}
#soundToggle .wave{opacity:0; transition:opacity .2s ease;}
#soundToggle .mute-x{opacity:1; transition:opacity .2s ease;}
#soundToggle.on .wave{opacity:1;}
#soundToggle.on .mute-x{opacity:0;}

/* ---- bottom dock: project cards fanned out along the bottom edge,
   overlapping like a hand of cards, mostly hidden below the window at rest.
   Rest state shows a sliver of each card set by --dock-peek - the title
   overlays the top of it (so that sliver is a readable title tab, not a
   bare strip of photo) with a bit of the photo showing beneath. Hover
   straightens the card, brings it to the front of the fan, and raises it to
   sit flush with the bottom of the page at --dock-rise, showing the full
   title, description, and photo. Every card is the same fixed size, so a
   new project just adds another card, no hand-placed coordinates needed.
   The card is taller than the dock's own box and simply overflows below the
   viewport edge at rest - nothing needs explicit clipping, it's off-canvas
   until it rises. IMPORTANT: #dock must keep overflow:visible (not auto/
   scroll on just one axis) - setting overflow-x without also leaving
   overflow-y as visible makes the browser silently clip overflow-y too
   (that's a CSS spec rule, not a bug), which stops the hover rise from
   working at all since it depends on cards extending above the dock's own
   (short) box. */
:root{ --dock-peek:clamp(140px,18vh,190px); --dock-rise:clamp(320px,44vh,520px); --dock-w:clamp(255px,27vw,360px); }
#dock{
  position:fixed; left:0; right:0; bottom:0; z-index:3; height:var(--dock-peek);
  display:flex; justify-content:center; align-items:flex-start;
  padding:0; overflow:visible; pointer-events:none;
}
.dc{
  position:relative; flex:0 0 auto; width:var(--dock-w); height:var(--dock-rise);
  overflow:hidden; text-decoration:none; color:var(--ink);
  pointer-events:auto; transform:translateY(0);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
  /* title band on top, photo filling the rest below it (a column, not an
     overlay) so the title never covers the top of the photo. */
  display:flex; flex-direction:column;
}
/* overlapping stack, flat across the top: every card after the first pulls
   left under the one before it, tops all in a straight line, no rotation.
   Later cards sit on top of earlier ones (normal DOM order) and STAY on top
   even when an earlier card behind them rises - no z-index bump on hover,
   so a card lower in the stack keeps its bottom corner tucked behind
   whichever card is already in front of it, rather than snapping above
   everything. Reads as the card rising up from its place in the stack
   instead of popping to the front of it. */
.dc:not(:first-child){ margin-left:calc(-1 * var(--dock-w) * .35); }
.dc:hover, .dc:focus-visible{ transform:translateY(calc(var(--dock-peek) - var(--dock-rise))); }
/* the photo fills whatever height is left under the title band. The title
   band is a fixed-height sibling (title + date only, no animating text), so
   the photo doesn't reflow on hover - the whole card just slides up. */
.dc-media{position:relative; flex:1 1 auto; min-height:0; z-index:0; overflow:hidden;}
/* Only `transform` is transitioned. `filter` was being animated too, and a
   filter transition on a large photo cannot run on the compositor - the browser
   re-rasterises the whole image every frame of the quarter-second fade, on four
   cards at once if you sweep across the dock. The saturate value still changes
   on hover, it just switches rather than ramping, which is not something you can
   see on a 6% shift. The scale, which you can see, stays smooth because
   transform is compositor-only. */
.dc-media img{display:block; width:100%; height:100%; object-fit:cover; object-position:top; filter:saturate(.94); transform:scale(1); transition:transform .5s cubic-bezier(.2,.8,.2,1);}
.dc:hover .dc-media img, .dc:focus-visible .dc-media img{filter:saturate(1.05); transform:scale(1.08);}
/* title (+ date) is a paper band at the TOP of the card, ABOVE the photo (not
   over it), so the photo's top is never covered. It's what shows in the peeking
   sliver at rest, with the photo starting just beneath it. No catch-phrase/
   teaser line on the home page (that lives on each project page). */
.dc-body{
  position:relative; z-index:1; flex:0 0 auto;
  background:#e9e7e2;   /* opaque paper (index.html has no --paper var) */
  padding:10px 10px 12px;
}
.dc-title{display:block; font-family:var(--disp); font-style:italic; font-size:20px; line-height:1.1;}
.dc-date{display:block; font-size:11px; letter-spacing:.16em; opacity:.7; margin-top:4px;}
/* the fan bleeds ~24px off each window edge (sizeDock adds +48). Inset the
   first card's title so it clears the left edge instead of being clipped. */
/* DESKTOP ONLY. On desktop the fan bleeds ~24px off each window edge, so the
   first card's title needs an inset to clear it. On mobile the dock is a plain
   stacked column with no bleed, so it needs no inset at all.

   This used to be an unconditional rule plus a `padding-left:0` override in
   the mobile block. That override was written when the mobile .dc-body had no
   horizontal padding, and it kept winning on specificity (0,3,0 beats 0,1,0)
   after the mobile padding became 12px - which is why KART, the first card,
   sat flush against the left edge while every other card was inset. Scoping
   the rule to desktop means mobile just uses the normal .dc-body padding and
   there is nothing left to override. */
@media (min-width:761px){ .dc:first-child .dc-body{padding-left:38px;} }
.dc:focus-visible{outline:1px solid var(--red); outline-offset:-2px;}

/* top-right dropdown menu (shared markup, built by js/menu.js) */
#menu-overlay{display:none;}
#menu-overlay.menu-panel{
  display:block; position:fixed; top:0; right:0; z-index:40;
  width:min(300px,82vw); max-height:100vh; overflow-y:auto;
  background:#e9e7e2; color:var(--ink);
  padding:89px 26px 28px;
  box-shadow:-2px 3px 22px rgba(0,0,0,.16);
  opacity:0; transform:translateY(-10px); pointer-events:none;
  transition:opacity .18s ease, transform .2s ease;
}
#menu-overlay.menu-panel.open{opacity:1; transform:none; pointer-events:auto;}
.menu-nav{display:flex; flex-direction:column; gap:12px;}
/* category dropdowns - see the matching, commented block in css/style.css.
   This page carries its own copy because index.html is fully inline (no
   stylesheet link), so the two must be kept in step when either changes. */
.menu-cat{display:flex; flex-direction:column;}
.menu-head{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; background:none; border:0; padding:6px 0; margin:0; font-family:inherit; font-size:9px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink); opacity:.48; cursor:pointer; text-align:left; transition:opacity .15s ease, color .15s ease;}
.menu-head:hover, .menu-head:focus-visible{opacity:1; color:var(--red);}
.menu-cat.open > .menu-head{opacity:.85;}
.menu-head-mark{position:relative; flex:0 0 auto; width:9px; height:9px;}
.menu-head-mark::before, .menu-head-mark::after{content:""; position:absolute; left:0; top:4px; width:9px; height:1px; background:currentColor; transition:transform .25s cubic-bezier(.2,.8,.2,1);}
.menu-head-mark::after{transform:rotate(90deg);}
.menu-cat.open .menu-head-mark::after{transform:rotate(0deg);}
.menu-cat-wrap{display:grid; grid-template-rows:0fr; visibility:hidden; transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s;}
.menu-cat.open > .menu-cat-wrap{grid-template-rows:1fr; visibility:visible; transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1), visibility 0s;}
.menu-cat-list{min-height:0; overflow:hidden; display:flex; flex-direction:column; gap:2px; padding-bottom:6px;}
.menu-cat-list a{font-family:var(--disp); font-style:italic; font-size:30px; line-height:1.12; color:var(--ink); text-decoration:none;}
.menu-cat-list a:hover, .menu-cat-list a:focus-visible{color:var(--red);}
.menu-cat-list a.is-here{opacity:.55;}
.menu-cat-list a.is-here::before{content:""; display:inline-block; width:14px; height:1px; background:var(--red); vertical-align:middle; margin-right:7px;}
.menu-links{display:flex; flex-direction:column; gap:7px; border-top:1px solid rgba(20,20,20,.16); padding-top:15px; margin-top:9px;}
.menu-links a{font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink); text-decoration:none;}
.menu-links a:hover{color:var(--red);}

#loader{position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:#e9e7e2; transition:opacity 650ms ease;}
/* ONE size for both the flat mark and the 3D canvas - the flat SVG is the
   same silhouette as the model seen front-on, which is the pose the animation
   starts in, so the static mark IS the first frame and the handoff is a
   dissolve in place. Keep in step with css/style.css. */
#loader{--ld-size:clamp(104px,15vmin,168px);}
.ld-mark{position:relative; width:var(--ld-size); height:var(--ld-size);}
.ld-mark svg{position:absolute; inset:0; width:100%; height:100%; display:block;}
.ld-logo path{fill:#141414;}
body.ready #loader{opacity:0; pointer-events:none;}
/* 3D logo (js/loader3d.js): swaps the static mark above for a real 3D
   render of the logo, front-on at first, then spinning - see that file's
   header comment. Absent entirely unless/until it loads. */
/* size/position set by js/loader3d.js - the canvas is ~1.84x the mark so the
   front-on face lands at exactly --ld-size, and overflows it during the tumble. */
.ld-3d{display:block; opacity:0; transition:opacity .22s ease; pointer-events:none;}

/* skip link: hidden until keyboard-focused, then drops in top-left */
.skip-link{position:absolute; left:8px; top:-60px; z-index:20; background:var(--ink); color:#e9e7e2; font-size:10px; letter-spacing:.16em; text-transform:uppercase; text-decoration:none; padding:8px 12px; transition:top .15s ease;}
.skip-link:focus{top:8px; outline:2px solid var(--red); outline-offset:2px;}

.fade-in{opacity:0; transform:translateY(6px); transition:opacity 700ms ease, transform 700ms ease;}
body.ready .fade-in{opacity:1; transform:none;}
body.ready .fade-in.d1{transition-delay:.05s;}
body.ready .fade-in.d2{transition-delay:.2s;}

@media (max-width:760px){
  /* scroll vertically only - never sideways. See the matching note in
     css/style.css: iOS needs the axis pinned explicitly or a stray wide child
     gives you a dead margin you can drag the page into. */
  body{overflow-x:hidden; overflow-y:auto; max-width:100%;}
  #home{top:24px; left:22px; width:20px; height:20px;}
  #burger{top:24px; right:22px; width:20px; height:20px;}
  #wordmark{top:24px; height:20px;}
  /* the background video plays on mobile now, so the sound toggle has
     something to control again. It sits above the scrolling dock. */
  #soundToggle{position:fixed; z-index:6; bottom:22px; right:22px;}
  /* the peek/rise/fan trick depends on hover, which touch devices don't
     really have - on mobile the dock just becomes a plain static stack,
     every card fully visible, no overlap or rotation, title + photo both
     showing at once, in normal page flow below the header. */
  #dock{position:static; height:auto; padding:108px 26px 80px; display:flex; flex-direction:column; align-items:stretch; gap:28px; overflow:visible; pointer-events:auto;}
  /* The WHOLE card gets the paper background, not just the title strip.
     With the background video now playing on mobile, the titles need something
     opaque behind them - but backing only the text made it read as a stray bar
     floating above the photo. Backing the card instead makes each project a
     paper card sitting on the footage, which is a deliberate-looking object. */
  .dc{position:static; display:block; width:100% !important; height:auto !important; margin-left:0 !important; transform:none !important; pointer-events:auto; background:#e9e7e2;}
  /* THE display:block IS NOT OPTIONAL.
     .dc-body and .dc-media are <span> elements. On desktop .dc is a flex
     container, so the browser blockifies them automatically and everything
     behaves. Switching .dc to display:block above removes that, and the spans
     fall back to being plain INLINE - at which point aspect-ratio does not
     apply to .dc-media at all (it is not a valid property on a non-replaced
     inline box), so the 4/3 photo frame silently vanished and the image sized
     itself from an inline parent with height:100%. That is what made the cards
     look wrong on a phone. Declaring them block restores the intended layout. */
  .dc-body{display:block; position:static; background:none; -webkit-backdrop-filter:none; backdrop-filter:none; padding:10px 12px 8px;}
  .dc-media{display:block; position:relative; aspect-ratio:4/3; margin:0;}
  .dc-media img{transform:none !important;}
}
@media (prefers-reduced-motion:reduce){ .bgvid{display:none;} }
</style>

<script>
/* ==========================================================================
   BACKGROUND CLIPS - the one array on this page you hand-edit. One is
   picked at random per load and plays behind everything. To preview a
   specific clip while tuning, add ?clip=0 (or 1, 2) to the URL.
   ========================================================================== */
const CLIPS = [
  { src: "videos/apple-blossom-baker-web.mp4", mb: 4.9 },
  { src: "videos/comox-glacier-web.mp4",       mb: 3.2 },
  { src: "videos/apple-blossom-sky-web.mp4",   mb: 6.2 }
];

// Every clip is in the rotation on every device, phones included (Owen's call,
// 2026-07-28 - an earlier version pinned phones to the lightest clip to save
// cellular data, which cost mobile visitors two thirds of the footage).
// Data Saver still opts out of video entirely, further down.
const CLIP_PICK = (function(){
  var m = location.search.match(/[?&]clip=(\d+)/);
  if(m){ var n = parseInt(m[1], 10); if(n >= 0 && n < CLIPS.length) return n; }
  return Math.floor(Math.random() * CLIPS.length);
})();
</script>

<script>
/* build the bottom dock. ORDER controls which projects show and in what
   order - add a project's key here to give it a card, nothing else to set
   by hand, every card is the same fixed size (see --dock-peek/--dock-rise
   in the CSS above). */
(function(){
  // storefront OBJECTS only, chronological most recent first: kart/amsalp
  // 2026, omni 2025, neb 2024. NAF is archive-only (academic) so it is not
  // shown on the home page; it lives only in the Archive menu.
  var ORDER = ["kart","amsalp","omni","neb"];
  function real(s){ return s && String(s).charAt(0)!=="["; }
  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // hover-to-prefetch: the moment the pointer lands on a card, warm the project
  // page's document + stylesheet (index uses inline CSS, so style.css isn't
  // cached yet) so the click feels instant. The card image is already the hero
  // image, so that's cached too. Deduped; prefetch (not preload) so it never
  // fights the current page for bandwidth.
  var _pf = {};
  function prefetch(href){
    if(!href || _pf[href]) return; _pf[href] = 1;
    var l = document.createElement("link"); l.rel = "prefetch"; l.href = href;
    document.head.appendChild(l);
  }

  var dock = document.getElementById("dock");
  ORDER.forEach(function(key, i){
    var p = PROJECTS[key]; if(!p) return;
    var date   = real(p.date) ? p.date : "";
    var first  = (p.gallery && p.gallery[0]) ? p.gallery[0] : "hero.jpg";

    var a = document.createElement("a");
    a.className = "dc";
    a.href = "project.html?p=" + key;
    a.innerHTML =
      '<span class="dc-body">' +
        '<span class="dc-title">'+esc(p.title)+'</span>' +
        (date ? '<span class="dc-date">'+esc(date)+'</span>' : '') +
      '</span>' +
      '<span class="dc-media">' +
        '<img src="projects/'+key+'/'+first+'" alt="'+esc(p.title)+'" loading="lazy" decoding="async">' +
      '</span>';
    a.addEventListener("mouseenter", function(){
      prefetch("project.html?p=" + key);
      prefetch("css/style.css?v=37");
    }, { once:true });
    dock.appendChild(a);
  });

  // size the cards so the overlapping fan spans the full width of the screen.
  // Each card after the first overlaps the previous by 35% (see the .dc
  // margin-left rule), so N cards occupy width * (1 + (N-1)*0.65). Solve that
  // for the viewport width and set --dock-w. Recompute on resize. On mobile
  // the dock is a plain stacked column (CSS), so leave it to the stylesheet.
  function sizeDock(){
    var n = dock.children.length;
    if(!n) return;
    if(window.innerWidth <= 760){ dock.style.removeProperty("--dock-w"); return; }
    // +48px so the fan runs a touch past both window edges (no side gap)
    var w = (window.innerWidth + 48) / (1 + (n - 1) * 0.65);
    dock.style.setProperty("--dock-w", Math.ceil(w) + "px");
  }
  sizeDock();
  window.addEventListener("resize", sizeDock);
})();
</script>

<script>
/* ---- background video: the picked clip, self-crossfaded in a loop ---- */
(function(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  // 2026-07-28: the video used to be skipped entirely under 760px, back when
  // the clips were 3-25MB each. They are 3-12MB now and the phone gets the
  // lightest one (see CLIP_PICK), so mobile plays it too. Data saver still
  // opts out completely - that is an explicit request from the visitor, not a
  // guess about their connection.
  if(navigator.connection && navigator.connection.saveData) return;

  /* ONE clip, looped with a crossfade onto itself across two layers. Both
     layers play the SAME clip offset by FADE: as one layer nears its end the
     other starts from 0 and fades up underneath it, so the end of the clip
     dissolves into its own start with no seam and nothing ever hides.
     Playback is slowed so the motion reads as gentle drift. */
  var clip = CLIPS[CLIP_PICK].src;
  var a = document.getElementById("vidA"), c = document.getElementById("vidB");
  var FADE = 1.4;          // crossfade window, seconds
  var RATE = 0.6;          // slow the footage so it drifts gently
  var layers = [a, c];
  var active = 0, armed = false;

  // Sound: OFF by default and stays off until the visitor finds and clicks
  // the small #soundToggle mark in the corner (a deliberate easter egg, not
  // called out anywhere) - fully opt-in. The hidden crossfade layer stays
  // muted regardless, so the two overlapping copies of the clip never play
  // audio at once.
  var AUDIO_VOL = 0.18;
  var soundOn = false, graphBuilt = false, audioCtx = null;

  // EQ: the raw clips carry low-frequency wind/traffic drone that reads as
  // noise more than ambience, and the bird activity that IS in them sits
  // quiet in comparison. Rather than bake an EQ into the mp4s (re-encoding
  // loses quality and can't be un-done from here), this runs the audio
  // through the Web Audio API live: a cascaded high-pass cuts the low-end
  // rumble, a small dip around 350Hz further tames residual mid-low drone,
  // two presence boosts lift the 3-8kHz band most birdsong sits in, and a
  // compressor stops those boosts from ever clipping. Applies to both
  // video layers identically so the crossfade doesn't change the tone.
  function buildEqChain(ctx, videoEl){
    var src = ctx.createMediaElementSource(videoEl);
    var hp1 = ctx.createBiquadFilter(); hp1.type = "highpass"; hp1.frequency.value = 180; hp1.Q.value = 0.7;
    var hp2 = ctx.createBiquadFilter(); hp2.type = "highpass"; hp2.frequency.value = 180; hp2.Q.value = 0.7;
    var dip = ctx.createBiquadFilter(); dip.type = "peaking"; dip.frequency.value = 350; dip.Q.value = 1.0; dip.gain.value = -5;
    var birdMid = ctx.createBiquadFilter(); birdMid.type = "peaking"; birdMid.frequency.value = 4500; birdMid.Q.value = 1.2; birdMid.gain.value = 6;
    var birdHigh = ctx.createBiquadFilter(); birdHigh.type = "peaking"; birdHigh.frequency.value = 7500; birdHigh.Q.value = 1.2; birdHigh.gain.value = 4;
    var limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -8; limiter.knee.value = 6; limiter.ratio.value = 4; limiter.attack.value = 0.003; limiter.release.value = 0.15;
    src.connect(hp1); hp1.connect(hp2); hp2.connect(dip); dip.connect(birdMid); birdMid.connect(birdHigh); birdHigh.connect(limiter); limiter.connect(ctx.destination);
  }
  function ensureGraph(){
    if(graphBuilt) return;
    graphBuilt = true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        audioCtx = new AC();
        layers.forEach(function(v){ buildEqChain(audioCtx, v); });
      }
    } catch(e){ /* Web Audio unsupported: falls back to the plain volume below, no EQ */ }
  }
  function applySound(){
    var cur = layers[active];
    cur.volume = AUDIO_VOL;
    cur.muted = !soundOn;
  }
  var soundBtn = document.getElementById("soundToggle");
  if(soundBtn){
    soundBtn.addEventListener("click", function(){
      ensureGraph();                                    // needs a user gesture to start, this click IS one
      if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      soundOn = !soundOn;
      applySound();
      soundBtn.classList.toggle("on", soundOn);
      soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
    });
  }

  function prep(v){ v.src = clip; v.loop = false; v.playbackRate = RATE; v.load(); }

  function arm(v){
    // hand off to the other layer: both videos sit at the SAME z-index, so
    // whichever is later in the DOM always paints on top regardless of which
    // one is "active." Starting both the fade-out and fade-in at the same
    // instant, over the same CSS transition length, makes the handoff look
    // identical every time no matter which layer is in front.
    var nextI = active ^ 1, next = layers[nextI], cur = layers[active];
    try { next.currentTime = 0; } catch(e){}
    // audio follows the visible layer only: unmute the incoming one (if the
    // visitor has already opted in via #soundToggle) and mute the outgoing
    // one before it disappears, so the two overlapping copies never sound
    // at once.
    if(soundOn){ next.volume = AUDIO_VOL; next.muted = false; }
    next.classList.add("show");
    next.play().catch(function(){});
    cur.classList.remove("show");
    cur.muted = true;
    active = nextI; armed = false;
  }

  function tick(v){
    if(layers[active] !== v) return;
    if(!v.duration || !isFinite(v.duration)) return;
    if(!armed && v.currentTime >= v.duration - FADE){ armed = true; arm(v); }
  }
  layers.forEach(function(v){ v.addEventListener("timeupdate", function(){ tick(v); }); });

  // start the first layer once its metadata is in, jumping to a random point
  // so the footage differs on each visit.
  a.addEventListener("loadedmetadata", function once(){
    a.removeEventListener("loadedmetadata", once);
    if(isFinite(a.duration) && a.duration > FADE + 1){
      try { a.currentTime = Math.random() * (a.duration - FADE - 0.6); } catch(e){}
    }
    a.classList.add("show");
    a.play().catch(function(){});
  });
  // layer B keeps preload="metadata" until A is actually playing, so the two
  // layers don't race each other for the same bytes on page load; it then has
  // the whole first pass of the clip to buffer before the first crossfade.
  a.addEventListener("playing", function onceP(){
    a.removeEventListener("playing", onceP);
    c.preload = "auto"; c.load();
  });
  // stop decoding entirely while the tab is hidden
  document.addEventListener("visibilitychange", function(){
    var cur = layers[active];
    if(document.hidden){ layers.forEach(function(v){ v.pause(); }); }
    else { cur.play().catch(function(){}); }
  });
  prep(a); prep(c);
})();

(function(){
  var done = false;
  function reveal(){ if(done) return; done = true; document.body.classList.add("ready"); }
  // lift the loader once the page is parsed plus a short beat. The background
  // video fades itself in when its first frame is ready, so we never wait on it.
  if(document.readyState !== "loading") setTimeout(reveal, 350);
  else document.addEventListener("DOMContentLoaded", function(){ setTimeout(reveal, 350); });
  window.addEventListener("load", reveal);   // safety net
  setTimeout(reveal, 1800);                   // hard cap
})();

/* the top-right dropdown menu (burger toggle, links, close-on-escape) is
   built and wired by js/menu.js, shared with every other page. */
</script>
</body>
</html>
