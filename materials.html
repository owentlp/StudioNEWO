<style>
  /* page-specific layout only: the shared editorial grammar (12-col grid,
     .cap/.desc type, .fig frames) lives in css/style.css and is reused as-is
     so this page reads like a project page, not a separate "about" style
     stacked-paragraph page. */
  .matg{max-width:none; margin:0; padding:clamp(140px,17vh,210px) var(--mar) clamp(80px,12vh,140px);}
  /* label + one line of .desc (the same justified body type the project pages
     use), and nothing else. No headline, no third size. */
  .matg-intro{margin-bottom:clamp(60px,9vh,110px);}
  /* wider than the default 32ch --w-desc cap, but still a readable measure -
     this line is the only body copy on the page at rest */
  .matg-intro .desc{margin-top:14px; max-width:58ch;}
  /* categories are collapsed by default - a clickable head row (label, a
     quiet preview of what's inside, and a count) that expands to reveal the
     full material entries below it. The height animation uses the CSS grid
     0fr/1fr trick so it works with content of any length with no JS
     measuring. No borders: the head row is set apart by weight/spacing only,
     matching the rest of the site's "no rules or boxes" grammar. */
  .matcat{margin-top:clamp(28px,4vh,44px);}
  .matcat:first-of-type{margin-top:0;}
  .matcat-head{
    display:block; width:100%;
    background:none; border:0; padding:clamp(14px,2.2vh,20px) 0 0; margin:0; text-align:left;
    font-family:var(--body); color:var(--ink); cursor:pointer;
  }
  .matcat-head-row{display:flex; align-items:baseline; gap:clamp(14px,2vw,26px); width:100%;}
  .matcat-head:hover{color:var(--red);}
  .matcat-head .cap.lbl{margin-bottom:0; flex:0 0 auto;}

  /* ---- SLIVER: a band of the category photo under the collapsed head ----
     At rest the index was nothing but rows of words; this puts the actual
     material on the page before anyone clicks. It grows a little on hover so
     the row reads as openable, and collapses to nothing once the category is
     open, where the full hero image takes over inside. */
  .matcat-sliver{
    display:block; margin-top:clamp(10px,1.4vh,15px);
    height:clamp(44px,7vh,72px); overflow:hidden;
    transition:height .34s cubic-bezier(.2,.8,.2,1), margin-top .34s cubic-bezier(.2,.8,.2,1), opacity .24s ease;
  }
  .matcat-sliver img{
    width:100%; height:100%; object-fit:cover; object-position:center 62%; display:block;
    filter:saturate(.92); transition:filter .3s ease, transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .matcat-head:hover .matcat-sliver{height:clamp(58px,9.5vh,96px);}
  .matcat-head:hover .matcat-sliver img{filter:saturate(1.04); transform:scale(1.03);}
  /* open: the sliver folds away, the hero inside the body takes its place */
  .matcat.open .matcat-sliver{height:0; margin-top:0; opacity:0;}
  @media (prefers-reduced-motion:reduce){
    .matcat-sliver, .matcat-sliver img{transition:none;}
  }
  .matcat-names{flex:1 1 auto; min-width:0; font-size:9px; letter-spacing:.03em; color:var(--ink); opacity:.55; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .matcat.open .matcat-names{opacity:0;}
  .matcat-count{flex:0 0 auto; font-size:9px; letter-spacing:.1em; opacity:.55;}
  .matcat-chev{flex:0 0 auto; font-size:13px; width:1em; text-align:center; transition:transform .3s ease;}
  .matcat.open .matcat-chev{transform:rotate(45deg);}   /* + becomes x */

  /* categories and subgroups reveal with a show + fade rather than a height
     animation: nesting two CSS height-collapse tricks made the inner one
     degenerate to zero height, and display:none is fully robust at any depth. */
  .matcat-body{display:none;}
  .matcat.open .matcat-body{display:block; animation:matReveal .32s ease;}
  .matcat-inner{padding-top:clamp(8px,1.4vh,16px); padding-bottom:clamp(12px,2vh,22px);}
  @keyframes matReveal{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}


  /* ---- OPEN CATEGORY: hero image (tree/ore/etc) + intro text ---- */
  .matcat-intro{display:grid; grid-template-columns:repeat(12,1fr); column-gap:var(--gut); align-items:start; margin-bottom:clamp(32px,5vh,58px);}
  .matcat-hero{grid-column:1 / 5; aspect-ratio:4/3; overflow:hidden;}
  .matcat-hero img{width:100%; height:100%; object-fit:cover; display:block;}
  .matcat-intro-text{grid-column:6 / 13; display:flex; flex-direction:column; gap:9px;}
  .matcat-intro-text .desc{max-width:54ch;}
  .mi-k{font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--red); margin-right:7px;}

  /* ---- GROUP (the dropdown subgroup: Hardwood, Aluminum, etc). Collapsed by
     default inside an open category; its own head toggles its materials open,
     a second accordion level nested inside the category one. ---- */
  .matgroup{margin-top:clamp(2px,0.6vh,8px);}
  .matgroup:first-of-type{margin-top:0;}
  .matgroup-head{
    display:flex; align-items:baseline; gap:clamp(12px,1.6vw,22px); width:100%;
    background:none; border:0; padding:clamp(9px,1.4vh,14px) 0; margin:0; text-align:left;
    font-family:var(--body); color:var(--ink); cursor:pointer;
  }
  .matgroup-head:hover{color:var(--red);}
  .matgroup-label{font-family:var(--disp); font-style:italic; font-weight:400; font-size:clamp(16px,1.8vw,22px); line-height:1; flex:0 0 auto;}
  .matgroup-names{flex:1 1 auto; min-width:0; font-size:9px; letter-spacing:.03em; color:var(--ink); opacity:.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .matgroup.open .matgroup-names{opacity:0;}
  .matgroup-count{flex:0 0 auto; font-size:9px; letter-spacing:.1em; opacity:.5;}
  .matgroup-chev{flex:0 0 auto; font-size:12px; width:1em; text-align:center; transition:transform .3s ease;}
  .matgroup.open .matgroup-chev{transform:rotate(45deg);}   /* + becomes x */
  .matgroup-body{display:none;}
  .matgroup.open .matgroup-body{display:block; animation:matReveal .3s ease;}
  .matgroup-inner{padding-top:clamp(6px,1vh,12px); padding-bottom:clamp(10px,1.8vh,20px);}
  .matgroup-meta{font-size:9px; line-height:1.55; letter-spacing:.02em; color:var(--ink); opacity:.72; max-width:74ch; margin-bottom:clamp(16px,2.4vh,24px);}
  .matgroup-meta .mg-k{color:var(--red); letter-spacing:.12em; text-transform:uppercase; margin-right:6px;}
  .matgroup-meta .mg-sep{opacity:.35; margin:0 9px;}

  /* ---- MATERIAL ITEM: small thumbnail + text, two per row ---- */
  .matgrid{display:grid; grid-template-columns:1fr 1fr; column-gap:clamp(24px,3vw,54px); row-gap:clamp(26px,4vh,44px);}
  .matitem{display:grid; grid-template-columns:clamp(72px,8vw,104px) 1fr; column-gap:clamp(14px,1.6vw,22px); align-items:start; scroll-margin-top:120px;}
  .matitem-media{aspect-ratio:1/1; overflow:hidden;}
  .matitem-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .matitem-text{min-width:0;}
  .mi-name{display:block; font-family:var(--disp); font-style:italic; font-size:clamp(15px,1.5vw,19px); line-height:1.08; margin-bottom:4px;}
  .mi-use{font-family:var(--body); font-style:normal; font-size:7px; letter-spacing:.16em; text-transform:uppercase; color:var(--red); vertical-align:middle; margin-left:8px; border:1px solid var(--red); padding:1px 5px; white-space:nowrap;}
  .mi-in{display:block; font-size:9px; letter-spacing:.05em; margin-bottom:6px;}
  .mi-in a{color:var(--ink); text-decoration:underline; text-decoration-color:rgba(20,20,20,.3); text-underline-offset:2px;}
  .mi-in a:hover{color:var(--red); text-decoration-color:var(--red);}
  .matitem-text .desc{max-width:100%;}

  /* colour swatch fallback, shown when a photo is missing (img onerror) */
  .matcat-hero, .matitem-media{background:#dcd8d0;}
  .matcat-hero.wood,.matitem-media.wood{background:linear-gradient(135deg,#8a5a34,#5e3a1f);}
  .matcat-hero.metal,.matitem-media.metal{background:linear-gradient(135deg,#c9cdd1,#82878d);}
  .matcat-hero.bio,.matitem-media.bio{background:linear-gradient(135deg,#7f8f56,#4d5c34);}
  .matcat-hero.glass,.matitem-media.glass{background:linear-gradient(135deg,#eef3f4,#c3cfd2);}
  .matcat-hero.plastic,.matitem-media.plastic{background:linear-gradient(135deg,#eee9df,#cfc8b7);}
  .matcat-hero.soft,.matitem-media.soft{background:linear-gradient(135deg,#cbb995,#96835a);}

  @media (max-width:900px){
    .matcat-intro{display:block;}
    .matcat-hero{width:100%; max-width:340px; margin-bottom:18px;}
    .matgrid{grid-template-columns:1fr;}
    .matcat-names{display:none;}   /* no room next to the label at this width */
  }
  @media (max-width:520px){
    .matitem{grid-template-columns:58px 1fr; column-gap:12px;}
  }
</style>
</head>

<main class="page matg" id="matg-content">
  <!-- Two type sizes, nothing else: the eyebrow label and one line of copy.
       This used to be four stacked blocks at four sizes (label, headline, lead,
       and a legend explaining the "In use" mark), which made the top of the page
       heavier than the index it was introducing. The headline is gone, and so is
       the legend - the red "In use" tag explains itself where it appears. -->
  <div class="matg-intro">
    <span class="eyebrow">MATERIALS INDEX</span>
    <p class="desc">Every material used across the studio's products. Chosen for how each one ages, wears, and comes apart, not for how it looks new.</p>
  </div>
  <div id="matg-cats"></div>
</main>

<script src="js/materials-data.js?v=2"></script>
<script src="js/projects-data.js?v=10"></script>
<script src="js/main.js?v=3"></script>
<script src="js/menu.js?v=4"></script>
<script>
(function(){
  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function real(s){ return s && String(s).trim() !== ""; }
  var root = document.getElementById("matg-cats");

  // one media figure. The colour-swatch fallback is baked into the figure's
  // own background (see CSS); if the photo 404s, onerror removes the <img> and
  // the swatch shows through, so a missing image never breaks the layout.
  // The src is held in data-src and set only when the section opens (loadImgs
  // below): the accordion hides content with display:none, and browsers never
  // fetch a loading="lazy" image inside a display:none subtree, so we defer and
  // load on reveal instead. This also keeps hidden sections from loading.
  function media(cls, file, alt){
    return '<figure class="'+cls+'"><img data-src="materials/'+esc(file)+'" alt="'+esc(alt)+'" decoding="async" onerror="this.remove()"></figure>';
  }
  function loadImgs(scope){
    if(!scope) return;
    scope.querySelectorAll('img[data-src]').forEach(function(img){
      img.src = img.getAttribute("data-src");
      img.removeAttribute("data-src");
    });
  }

  var html = MATERIAL_CATEGORIES.map(function(cat){
    var total = cat.groups.reduce(function(a,g){ return a + g.items.length; }, 0);
    var groupNames = cat.groups.map(function(g){ return g.label; }).join("  /  ");

    var introText = [
      real(cat.intro.properties) ? '<p class="desc"><span class="mi-k">Properties</span>'+esc(cat.intro.properties)+'</p>' : '',
      real(cat.intro.finishes)   ? '<p class="desc"><span class="mi-k">Finishes</span>'+esc(cat.intro.finishes)+'</p>' : '',
      real(cat.intro.lifecycle)  ? '<p class="desc"><span class="mi-k">Lifecycle</span>'+esc(cat.intro.lifecycle)+'</p>' : ''
    ].join("");
    var intro = '<div class="matcat-intro">' +
      media("matcat-hero "+esc(cat.swatch), cat.image, cat.label) +
      '<div class="matcat-intro-text">'+introText+'</div></div>';

    var groups = cat.groups.map(function(g){
      var meta = [
        real(g.properties) ? '<span class="mg-k">Properties</span>'+esc(g.properties) : '',
        real(g.bestUses)   ? '<span class="mg-k">Best uses</span>'+esc(g.bestUses) : '',
        real(g.lifecycle)  ? '<span class="mg-k">Lifecycle</span>'+esc(g.lifecycle) : ''
      ].filter(Boolean).join('<span class="mg-sep">/</span>');

      var items = g.items.map(function(it){
        var use = it.used ? '<span class="mi-use">In use</span>' : '';
        var usedIn = (it.usedIn && it.usedIn.length)
          ? '<span class="mi-in">Used in: '+it.usedIn.map(function(u){ return '<a href="project.html?p='+esc(u.id)+'">'+esc(u.title)+'</a>'; }).join(", ")+'</span>'
          : '';
        return '<div class="matitem" id="'+esc(it.slug)+'">' +
                 media("matitem-media "+esc(cat.swatch), it.image, it.name) +
                 '<div class="matitem-text">' +
                   '<span class="mi-name">'+esc(it.name)+use+'</span>' +
                   usedIn +
                   '<p class="desc">'+esc(it.copy)+'</p>' +
                 '</div>' +
               '</div>';
      }).join("");

      // each subgroup is its own collapsible: its head (label + material-name
      // preview + count + chevron) toggles the body (meta + material grid).
      var groupPreview = g.items.map(function(it){ return it.name; }).join("  /  ");
      return '<div class="matgroup">' +
               '<button class="matgroup-head" aria-expanded="false">' +
                 '<span class="matgroup-label">'+esc(g.label)+'</span>' +
                 '<span class="matgroup-names">'+esc(groupPreview)+'</span>' +
                 '<span class="matgroup-count">'+g.items.length+'</span>' +
                 '<span class="matgroup-chev">+</span>' +
               '</button>' +
               '<div class="matgroup-body"><div class="matgroup-inner">' +
                 (meta ? '<p class="matgroup-meta">'+meta+'</p>' : '') +
                 '<div class="matgrid">'+items+'</div>' +
               '</div></div>' +
             '</div>';
    }).join("");

    // SLIVER: a thin band of the category photo under the collapsed head, so a
    // closed index still shows wood/metal/glass instead of a list of words.
    // It loads eagerly (unlike the full hero inside, which waits for the
    // category to open) because it is visible on arrival - these are the only
    // images on the page at rest. Colour-swatch fallback via onerror, same as
    // the hero, so a missing photo degrades to the category's colour rather
    // than a broken image.
    var sliver = '<span class="matcat-sliver ' + esc(cat.swatch) + '">' +
                   (cat.image ? '<img src="materials/'+esc(cat.image)+'" alt="" loading="eager" decoding="async" onerror="this.remove()">' : '') +
                 '</span>';

    return '<section class="matcat">' +
             '<button class="matcat-head" aria-expanded="false">' +
               '<span class="matcat-head-row">' +
                 '<span class="cap lbl">'+esc(cat.label)+'</span>' +
                 '<span class="matcat-names">'+esc(groupNames)+'</span>' +
                 '<span class="matcat-count">'+total+' MATERIALS</span>' +
                 '<span class="matcat-chev">+</span>' +
               '</span>' +
               sliver +
             '</button>' +
             '<div class="matcat-body"><div class="matcat-inner">'+intro+groups+'</div></div>' +
           '</section>';
  }).join("");
  root.innerHTML = html;

  // click a head to expand/collapse its category. Opening one does not close
  // the others; this is a reference page, someone comparing two categories
  // shouldn't have to fight the accordion for it.
  // click a category head to reveal its description + the list of subgroups.
  // Opening it loads the category's hero image (the material thumbnails wait
  // until their own subgroup is opened).
  root.querySelectorAll(".matcat-head").forEach(function(btn){
    btn.addEventListener("click", function(){
      var cat = btn.closest(".matcat");
      var open = !cat.classList.contains("open");
      cat.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if(open) loadImgs(cat.querySelector(".matcat-intro"));
    });
  });

  // click a subgroup head to reveal its materials (second level), loading that
  // subgroup's thumbnails.
  root.querySelectorAll(".matgroup-head").forEach(function(btn){
    btn.addEventListener("click", function(){
      var g = btn.closest(".matgroup");
      var open = !g.classList.contains("open");
      g.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if(open) loadImgs(g.querySelector(".matgroup-body"));
    });
  });

  // deep-link support: materials.html#<slug> opens that material's category
  // AND its subgroup, then scrolls to it, so a material chip on a project page
  // can point straight at the right entry through both accordion levels.
  if(location.hash){
    var target = document.getElementById(location.hash.slice(1));
    if(target){
      var cat = target.closest(".matcat");
      if(cat){ cat.classList.add("open"); var h=cat.querySelector(".matcat-head"); if(h) h.setAttribute("aria-expanded","true"); loadImgs(cat.querySelector(".matcat-intro")); }
      var grp = target.closest(".matgroup");
      if(grp){ grp.classList.add("open"); var gh=grp.querySelector(".matgroup-head"); if(gh) gh.setAttribute("aria-expanded","true"); loadImgs(grp.querySelector(".matgroup-body")); }
      setTimeout(function(){ target.scrollIntoView({block:"center"}); }, 300);
    }
  }
})();
</script>
