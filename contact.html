<style>
  /* contact form: same editorial grammar as the rest of the site, no boxes,
     thin underline fields, tiny OCR-B labels, one red action. */
  .cform{margin-top:clamp(30px,5vh,56px); max-width:46ch; display:grid; gap:22px;}
  .cfield{display:grid; gap:6px;}
  .cfield label{font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink);}
  .cfield input, .cfield textarea{
    font-family:var(--body); font-size:13px; color:var(--ink); background:transparent;
    border:0; border-bottom:1px solid rgba(20,20,20,.28); padding:7px 0; width:100%;
    letter-spacing:.02em; transition:border-color .18s ease;
  }
  .cfield textarea{resize:vertical; min-height:96px; line-height:1.5;}
  .cfield input:focus, .cfield textarea:focus{outline:0; border-color:var(--red);}
  .cform-hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}
  .cform button{
    justify-self:start; font-family:var(--body); font-size:10px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--paper); background:var(--red); border:0;
    padding:10px 18px; cursor:pointer; transition:opacity .18s ease;
  }
  .cform button:hover{opacity:.85;}
  .cform button:disabled{opacity:.5; cursor:default;}
  .cform-status{font-size:10px; letter-spacing:.06em; line-height:1.5; min-height:1.2em; color:var(--ink);}
  .cform-status.err{color:var(--red);}
  /* the mailto fallback panel (hidden until a handoff has been attempted) */
  .cf-fallback{margin-top:26px; border-left:2px solid var(--red); padding:2px 0 2px 16px; max-width:56ch;}
  .cf-fb-lead{font-size:13px; letter-spacing:.06em; margin:0 0 10px;}
  .cf-fb-lead a{color:var(--ink); border-bottom:1px solid var(--red); text-decoration:none; padding-bottom:1px;}
  .cf-fb-text{font-family:var(--body); font-size:12px; line-height:1.6; white-space:pre-wrap;
    word-break:break-word; margin:0 0 12px; color:var(--ink-soft); max-height:210px; overflow:auto;}
  .cf-fb-copy{font-family:var(--body); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:#fff; background:var(--red); border:0; padding:8px 14px; cursor:pointer; transition:opacity .15s ease;}
  .cf-fb-copy:hover{opacity:.82;}

  .contact-alt{margin-top:clamp(34px,6vh,60px); font-size:10px; letter-spacing:.1em; text-transform:uppercase; line-height:2;}
  .contact-alt a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--red); padding-bottom:1px;}
  .contact-alt .sep{opacity:.4; margin:0 10px;}
</style>

  <!-- Header removed by request, same as the info page: the menu already says
       CONTACT and the lead line below says what the page is for. The <h1> is
       kept but visually hidden - the page still needs one heading for search
       engines and screen readers, and losing it would be a regression nobody

  <h1 class="vh">Contact</h1>
  <p class="lead">For project inquiries, collaborations, or freelance and consulting work, get in touch.</p>

  <form class="cform" id="contactForm" novalidate>
    <div class="cfield">
      <label for="cf-name">Name</label>
      <input id="cf-name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="cfield">
      <label for="cf-email">Email</label>
      <input id="cf-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="cfield">
      <label for="cf-message">Message</label>
      <textarea id="cf-message" name="message" required></textarea>
    </div>
    <!-- honeypot: bots fill it, humans never see it; a filled value is dropped -->
    <div class="cform-hp" aria-hidden="true">
      <label for="cf-company">Company</label>
      <input id="cf-company" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
    </div>
    <button type="submit" id="cf-submit">Send message</button>
    <p class="cform-status" id="cf-status" role="status" aria-live="polite"></p>
  </form>

  <!-- Only ever shown after a mailto: handoff, which the browser gives no way
       of confirming. See showMailFallback() at the bottom of this file. -->
  <div class="cf-fallback" id="cf-fallback" hidden>
    <p class="cf-fb-lead">Send it to <a href="mailto:owen@studionewo.com">owen@studionewo.com</a></p>
    <pre class="cf-fb-text"></pre>
    <button type="button" class="cf-fb-copy">Copy message</button>
  </div>

  <p class="contact-alt">
    <a href="mailto:owen@studionewo.com">owen@studionewo.com</a>
    <span class="sep">/</span>
    <a href="https://www.instagram.com/studio.newo" target="_blank" rel="noopener">Instagram</a>
  </p>

<script>
/* Contact form. Posts to Formspree (no server needed) via fetch, so the page
   never reloads. Until a real endpoint is set below, it falls back to opening
   the visitor's mail app with the message prefilled, so the form still works
   today. To turn on the hosted form: make a free form at formspree.io, then
   paste its endpoint (looks like https://formspree.io/f/abcdwxyz) as
   FORMSPREE_ENDPOINT. Nothing else to change. */
(function(){
  /* The live Formspree endpoint, set 2026-09-25. Submissions land in the
     inbox configured on that form at formspree.io.
     If this is ever blanked out the form does NOT silently break: it falls
     back to a prefilled mail draft and also prints the message on screen with
     the address and a copy button, so an enquiry still gets through on a
     device where mailto: does nothing. See showMailFallback() below. */
  var FORMSPREE_ENDPOINT = "https://formspree.io/f/xnpnbokn";
  var MAILTO = "owen@studionewo.com";

  var form = document.getElementById("contactForm");
  var statusEl = document.getElementById("cf-status");
  var btn = document.getElementById("cf-submit");
  if(!form) return;

  function setStatus(msg, isErr){
    statusEl.textContent = msg;
    statusEl.classList.toggle("err", !!isErr);
  }

  /* Shown after a mailto: handoff, because there is no way to know whether it
     did anything. Gives the visitor the address, the message they just typed,
     and one button that puts the whole thing on the clipboard. */
  function showMailFallback(name, email, message){
    var box = document.getElementById("cf-fallback");
    if(!box) return;
    var text = "To: " + MAILTO + "\n" +
               "Subject: Studio NEWO inquiry from " + name + "\n\n" +
               message + "\n\n" + name + "\n" + email;
    box.hidden = false;
    var pre = box.querySelector(".cf-fb-text");
    if(pre) pre.textContent = text;
    var copy = box.querySelector(".cf-fb-copy");
    if(copy && !copy.dataset.wired){
      copy.dataset.wired = "1";
      copy.addEventListener("click", function(){
        var done = function(){ copy.textContent = "Copied"; setTimeout(function(){ copy.textContent = "Copy message"; }, 2200); };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(done, function(){});
        } else {
          try {
            var ta = document.createElement("textarea");
            ta.value = text; ta.setAttribute("readonly","");
            ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            document.execCommand("copy"); ta.remove(); done();
          } catch(e){}
        }
      });
    }
    setStatus("If your mail app did not open, use the address below.", true);
    box.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(form.querySelector('[name="_gotcha"]').value) return;   // bot caught
    var name = form.name.value.trim();
    var email = form.email.value.trim();
    var message = form.message.value.trim();
    if(!name || !email || !message){ setStatus("Please fill in every field.", true); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setStatus("That email address looks off.", true); return; }

    /* ---- NO HOSTED ENDPOINT: THE FALLBACK MUST NEVER FAIL SILENTLY ----
       This used to set window.location to a mailto: and say "Opening your mail
       app..." and that was the end of it. On a phone, or on any machine with no
       mail client registered, absolutely nothing happens: no app opens, no
       error, and the visitor is left looking at a message saying it worked.
       Every enquiry from one of those visitors was lost without either side
       knowing.
       Now the draft is still attempted, but the message stays on screen with
       the address spelled out and the text ready to copy, so the visitor always
       has a way through even when the handoff does nothing. Nothing here
       depends on being able to detect whether the mail app actually opened -
       the browser does not tell you, which is the whole problem. */
    if(!FORMSPREE_ENDPOINT){
      var subject = encodeURIComponent("Studio NEWO inquiry from " + name);
      var body = encodeURIComponent(message + "\n\n" + name + "\n" + email);
      try { window.location.href = "mailto:" + MAILTO + "?subject=" + subject + "&body=" + body; }
      catch(err){}
      showMailFallback(name, email, message);
      return;
    }

    btn.disabled = true;
    setStatus("Sending...");
    fetch(FORMSPREE_ENDPOINT, {
      method: "POST",
      headers: { "Accept": "application/json" },
      body: new FormData(form)
    }).then(function(res){
      if(res.ok){
        form.reset();
        setStatus("Thanks. Your message is on its way.");
      } else {
        setStatus("Something went wrong. Email " + MAILTO + " instead.", true);
      }
      btn.disabled = false;
    }).catch(function(){
      setStatus("Network error. Email " + MAILTO + " instead.", true);
      btn.disabled = false;
    });
  });
})();
</script>
